    function saveChecklistForm(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const trip = getCurrentTrip();
      trip.checklist.push({
        id: generateId('chk'),
        category: fd.get('category'),
        text: fd.get('text').trim(),
        checked: false
      });
      saveState();
      closeModal();
      renderApp();
      showToast('已加入行李清單');
    }

    // ------------------------------------------
    // 彈窗 D：多趟旅程切換與管理
    // ------------------------------------------
    function openTripSelector() {
      const currentId = appState.currentTripId;
      const tripsHtml = appState.trips
        .map(t => {
          const theme = THEME_COLORS[t.theme] || THEME_COLORS.sage;
          const isCurrent = t.id === currentId;
          const curr = getTripCurrencyInfo(t);
          return `
            <div class="flex items-center justify-between gap-2 p-3 rounded-2xl border ${isCurrent ? 'border-sage-500 bg-sage-50/60' : 'border-stone-200 bg-white'}">
              <button type="button" onclick="switchTrip('${t.id}')" class="flex items-center gap-3 flex-1 text-left min-w-0">
                <div class="w-10 h-10 rounded-xl ${theme.bg} text-white flex items-center justify-center shrink-0">
                  <i data-lucide="compass" class="w-5 h-5"></i>
                </div>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5">
                    <span class="font-bold text-sm text-ink-900 truncate">${escapeHtml(t.title)}</span>
                    ${isCurrent ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-sage-500 text-white shrink-0">目前</span>` : ''}
                  </div>
                  <p class="text-xs text-ink-600 truncate">${escapeHtml(t.destination)} · ${t.startDate} (${t.days}天) · ${curr.code}</p>
                </div>
              </button>
              <div class="flex items-center gap-1 shrink-0">
                <button type="button" onclick="openTripFormModal('${t.id}')" class="p-2 text-ink-400 hover:text-sage-600 rounded-xl hover:bg-stone-100" title="編輯">
                  <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>
                ${
                  appState.trips.length > 1
                    ? `<button type="button" onclick="confirmDeleteTrip('${t.id}')" class="p-2 text-ink-400 hover:text-rose-500 rounded-xl hover:bg-rose-50" title="刪除">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>`
                    : ''
                }
              </div>
            </div>
          `;
        })
        .join('');

      openModal(`
        <div class="p-5 overflow-y-auto space-y-4">
          <div class="flex items-center justify-between border-b border-stone-100 pb-3">
            <h3 class="font-bold text-base text-ink-900">我的旅遊手帳 (${appState.trips.length})</h3>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-ink-600"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <div class="space-y-2.5 max-h-[50vh] overflow-y-auto">
            ${tripsHtml}
          </div>

          <button type="button" onclick="openTripFormModal()" class="w-full py-3 rounded-2xl bg-sage-500 text-white font-bold text-sm shadow-md hover:bg-sage-600 flex items-center justify-center gap-2 active:scale-[0.99] transition">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            建立新的旅遊行程
          </button>
        </div>
      `);
    }

    function switchTrip(tripId) {
      appState.currentTripId = tripId;
      selectedDay = 1;
      noteFilter = 'all';
      noteSearchQuery = '';
      saveState();
      closeModal();
      renderApp();
      showToast('已切換旅程');
    }

    function confirmDeleteTrip(tripId) {
      if (appState.trips.length <= 1) {
        showToast('至少需保留一趟旅程喔');
        return;
      }
      openConfirmModal('刪除整趟旅程', '確定要刪除這趟旅程及其所有行程與筆記嗎？此操作無法復原。', '確認刪除', () => {
        appState.trips = appState.trips.filter(t => t.id !== tripId);
        if (appState.currentTripId === tripId) {
          appState.currentTripId = appState.trips[0].id;
        }
        saveState();
        renderApp();
        showToast('已刪除該旅程');
      });
    }

    // ------------------------------------------
    // 彈窗 E：新增 / 編輯 旅程表單（含開始/結束日期連動 + 幣別匯率設定）
    // ------------------------------------------
    function openTripFormModal(tripId = null) {
      const trip = tripId ? appState.trips.find(t => t.id === tripId) : null;
      const isEdit = Boolean(trip);
      const defaultStart = formatDateISO(new Date());
      const startVal = trip?.startDate || defaultStart;
      const daysVal = trip?.days || 4;
      const endVal = getEndDateISO(startVal, daysVal);

      const currentCode = (trip?.currency || 'JPY').toUpperCase();
      const currentSymbol = trip?.currencySymbol || (CURRENCY_PRESETS.find(p => p.code === currentCode)?.symbol || '¥');
      const currentRate = trip?.exchangeRate !== undefined ? trip.exchangeRate : 0.215;

      const themeRadios = Object.entries(THEME_COLORS)
        .map(([k, v]) => {
          const checked = (trip?.theme || 'sage') === k ? 'checked' : '';
          return `
            <label class="cursor-pointer flex flex-col items-center gap-1">
              <input type="radio" name="theme" value="${k}" ${checked} class="sr-only peer" />
              <div class="w-9 h-9 rounded-full ${v.bg} ring-offset-2 peer-checked:ring-2 peer-checked:ring-ink-900 transition"></div>
              <span class="text-[11px] text-ink-600">${v.name}</span>
            </label>
          `;
        })
        .join('');

      const presetButtons = CURRENCY_PRESETS.map(p => `
        <button type="button" onclick="applyCurrencyPreset('${p.code}', '${p.symbol}', ${p.defaultRate})" class="shrink-0 px-2.5 py-1.5 rounded-xl border border-stone-200 bg-white hover:bg-sage-50 hover:border-sage-300 text-xs font-semibold text-ink-700 active:scale-95 transition">
          ${p.code} ${p.symbol}
        </button>
      `).join('');

      openModal(`
        <div class="p-5 overflow-y-auto space-y-4">
          <div class="flex items-center justify-between border-b border-stone-100 pb-3">
            <h3 class="font-bold text-base text-ink-900">${isEdit ? '編輯旅程與匯率設定' : '建立新旅程'}</h3>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-ink-600"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <form onsubmit="saveTripForm(event, '${tripId || ''}')" class="space-y-3.5">
            <div>
              <label class="block text-xs font-semibold text-ink-600 mb-1">旅程名稱 *</label>
              <input type="text" name="title" required placeholder="例如：京阪神六天五夜賞楓之旅" value="${escapeHtml(trip?.title || '')}" class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500" />
            </div>

            <div>
              <label class="block text-xs font-semibold text-ink-600 mb-1">目的地 *</label>
              <input type="text" name="destination" required placeholder="例如：日本・大阪" value="${escapeHtml(trip?.destination || '')}" class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500" />
            </div>

            <!-- 開始日期 ＆ 結束日期（自動換算天數） -->
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-ink-600 mb-1">開始日期 *</label>
                <input type="date" id="trip-start-date" name="startDate" required value="${startVal}" onchange="syncTripDates('start')" class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500" />
              </div>
              <div>
                <div class="flex items-center justify-between mb-1">
                  <label class="text-xs font-semibold text-ink-600">結束日期 *</label>
                  <span id="trip-days-badge" class="text-[11px] font-bold text-sage-600 bg-sage-50 px-1.5 py-0.5 rounded">共 ${daysVal} 天</span>
                </div>
                <input type="date" id="trip-end-date" name="endDate" required value="${endVal}" min="${startVal}" onchange="syncTripDates('end')" class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500" />
              </div>
            </div>

            <!-- 幣別與匯率設定區塊 -->
            <div class="bg-cream p-3.5 rounded-2xl border border-stone-200/80 space-y-3">
              <div class="flex items-center justify-between">
                <label class="text-xs font-bold text-ink-900 flex items-center gap-1.5">
                  <i data-lucide="coins" class="w-3.5 h-3.5 text-terracotta-500"></i>
                  當地幣別 ＆ 台幣匯率
                </label>
                <span class="text-[11px] text-ink-400">點選快速帶入</span>
              </div>

              <!-- 常用幣別快選列 -->
              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                ${presetButtons}
              </div>

              <div class="grid grid-cols-3 gap-2.5">
                <div>
                  <label class="block text-[11px] font-semibold text-ink-600 mb-1">幣別代碼</label>
                  <input type="text" id="trip-currency-input" name="currency" required placeholder="JPY" value="${escapeHtml(currentCode)}" oninput="updateTripRateHelper()" class="w-full bg-white border border-stone-200 rounded-xl px-2.5 py-2 text-sm uppercase font-bold focus:outline-none focus:border-sage-500" />
                </div>
                <div>
                  <label class="block text-[11px] font-semibold text-ink-600 mb-1">貨幣符號</label>
                  <input type="text" id="trip-symbol-input" name="currencySymbol" placeholder="¥" value="${escapeHtml(currentSymbol)}" class="w-full bg-white border border-stone-200 rounded-xl px-2.5 py-2 text-sm font-bold focus:outline-none focus:border-sage-500" />
                </div>
                <div>
                  <label class="block text-[11px] font-semibold text-ink-600 mb-1">匯率 (兌 TWD)</label>
                  <input type="number" id="trip-rate-input" name="exchangeRate" required min="0.0001" step="any" placeholder="0.215" value="${currentRate}" oninput="updateTripRateHelper()" class="w-full bg-white border border-stone-200 rounded-xl px-2.5 py-2 text-sm font-mono font-bold text-terracotta-600 focus:outline-none focus:border-sage-500" />
                </div>
              </div>

              <!-- 匯率雙向換算提示 -->
              <div id="trip-rate-helper" class="text-[11px] text-ink-600 bg-white px-3 py-2 rounded-xl border border-stone-100 flex items-center justify-between">
                <span>1 ${escapeHtml(currentCode)} = ${currentRate} TWD</span>
                <span class="text-sage-600 font-semibold">${currentCode === 'TWD' ? '基準貨幣' : `1 TWD ≈ ${(1 / (Number(currentRate) || 1)).toFixed(2)} ${escapeHtml(currentCode)}`}</span>
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-ink-600 mb-2">手帳主題色</label>
              <div class="flex items-center justify-between bg-cream p-3 rounded-2xl border border-stone-200/70">
                ${themeRadios}
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-ink-600 mb-1">旅程簡介 / 期待小語</label>
              <textarea name="coverNote" rows="2" placeholder="寫下這趟旅行的重點或心情..." class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-sage-500">${escapeHtml(trip?.coverNote || '')}</textarea>
            </div>

            <button type="submit" class="w-full py-3 rounded-2xl bg-sage-500 text-white font-bold text-sm shadow-md hover:bg-sage-600 active:scale-[0.99] transition">
              ${isEdit ? '儲存設定' : '開始規劃這趟旅程'}
            </button>
          </form>
        </div>
      `);
    }

    function syncTripDates(changedField) {
      const startEl = document.getElementById('trip-start-date');
      const endEl = document.getElementById('trip-end-date');
      const badgeEl = document.getElementById('trip-days-badge');
      if (!startEl || !endEl || !badgeEl) return;

      if (changedField === 'start') {
        endEl.min = startEl.value;
        if (endEl.value < startEl.value) {
          endEl.value = startEl.value;
        }
      }
      const days = calcDaysBetween(startEl.value, endEl.value);
      badgeEl.textContent = `共 ${days} 天`;
    }

    function applyCurrencyPreset(code, symbol, defaultRate) {
      const codeInput = document.getElementById('trip-currency-input');
      const symInput = document.getElementById('trip-symbol-input');
      const rateInput = document.getElementById('trip-rate-input');
      if (codeInput) codeInput.value = code;
      if (symInput) symInput.value = symbol;
      if (rateInput) rateInput.value = defaultRate;
      updateTripRateHelper();
    }

    function updateTripRateHelper() {
      const codeInput = document.getElementById('trip-currency-input');
      const rateInput = document.getElementById('trip-rate-input');
      const helper = document.getElementById('trip-rate-helper');
      if (!codeInput || !rateInput || !helper) return;

      const code = (codeInput.value.trim() || 'TWD').toUpperCase();
      const rate = Number(rateInput.value) || 0;

      if (code === 'TWD') {
        rateInput.value = 1;
        helper.innerHTML = `<span>1 TWD = 1 TWD</span><span class="text-sage-600 font-semibold">新台幣基準</span>`;
        return;
      }

      if (rate > 0) {
        const reverse = (1 / rate).toFixed(2);
        helper.innerHTML = `
          <span>1 ${escapeHtml(code)} = <strong>${rate}</strong> TWD</span>
          <span class="text-sage-600 font-semibold">1 TWD ≈ ${reverse} ${escapeHtml(code)}</span>
        `;
      } else {
        helper.innerHTML = `<span class="text-rose-500">請輸入大於 0 的匯率數值</span>`;
      }
    }

    function saveTripForm(e, tripId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const startDateVal = fd.get('startDate');
      const endDateVal = fd.get('endDate');
      const daysVal = calcDaysBetween(startDateVal, endDateVal);
      const codeVal = (fd.get('currency').trim() || 'TWD').toUpperCase();
      const preset = CURRENCY_PRESETS.find(p => p.code === codeVal);
      const symbolVal = fd.get('currencySymbol').trim() || (preset ? preset.symbol : `${codeVal} `);
      const rateVal = codeVal === 'TWD' ? 1 : (Number(fd.get('exchangeRate')) > 0 ? Number(fd.get('exchangeRate')) : 1);

      if (tripId) {
        const trip = appState.trips.find(t => t.id === tripId);
        if (trip) {
          trip.title = fd.get('title').trim();
          trip.destination = fd.get('destination').trim();
          trip.currency = codeVal;
          trip.currencySymbol = symbolVal;
          trip.exchangeRate = rateVal;
          trip.startDate = startDateVal;
          trip.days = daysVal;
          trip.theme = fd.get('theme') || 'sage';
          trip.coverNote = fd.get('coverNote').trim();
        }
      } else {
        const newTrip = {
          id: generateId('trip'),
          title: fd.get('title').trim(),
          destination: fd.get('destination').trim(),
          currency: codeVal,
          currencySymbol: symbolVal,
          exchangeRate: rateVal,
          startDate: startDateVal,
          days: daysVal,
          theme: fd.get('theme') || 'sage',
          coverNote: fd.get('coverNote').trim(),
          itinerary: [],
          notes: [],
          checklist: [
            { id: generateId('chk'), category: 'docs', text: '護照 / 身分證件', checked: false },
            { id: generateId('chk'), category: 'docs', text: `${codeVal} 現金 ＆ 海外回饋信用卡`, checked: false },
            { id: generateId('chk'), category: 'electronics', text: '手機充電器 ＆ 行動電源', checked: false },
            { id: generateId('chk'), category: 'clothes', text: '換洗衣物 ＆ 個人保養品', checked: false }
          ]
        };
        appState.trips.unshift(newTrip);
        appState.currentTripId = newTrip.id;
        selectedDay = 1;
      }

      saveState();
      closeModal();
      renderApp();
      showToast(tripId ? '旅程與匯率設定已更新' : '已建立新旅程！');
    }

    // ------------------------------------------
    // 彈窗 F：隨手匯率速算器 (購物/點餐即時雙向換算)
    // ------------------------------------------
    function openCurrencyCalculator() {
      const trip = getCurrentTrip();
      const info = getTripCurrencyInfo(trip);
      const quickAmounts = info.code === 'JPY' ? [100, 500, 1000, 5000, 10000]
        : info.code === 'KRW' ? [1000, 5000, 10000, 30000, 50000]
        : [10, 50, 100, 500, 1000];

      const quickBtns = quickAmounts.map(amt => `
        <button type="button" onclick="setCalcForeignAmount(${amt}, ${info.rate})" class="px-2.5 py-1.5 rounded-xl bg-stone-100 hover:bg-sage-50 text-xs font-semibold text-ink-700 active:scale-95 transition">
          ${escapeHtml(info.symbol)}${amt.toLocaleString()}
        </button>
      `).join('');

      openModal(`
        <div class="p-5 overflow-y-auto space-y-4">
          <div class="flex items-center justify-between border-b border-stone-100 pb-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-xl bg-sage-50 text-sage-600 flex items-center justify-center">
                <i data-lucide="calculator" class="w-4 h-4"></i>
              </div>
              <div>
                <h3 class="font-bold text-base text-ink-900">隨手匯率速算機</h3>
                <p class="text-[11px] text-ink-400">目前匯率：1 ${escapeHtml(info.code)} = ${info.rate} TWD</p>
              </div>
            </div>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-ink-600"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <div class="space-y-3">
            <!-- 當地外幣輸入 -->
            <div class="bg-cream p-3.5 rounded-2xl border border-stone-200/80">
              <div class="flex items-center justify-between mb-1">
                <label class="text-xs font-bold text-ink-600">當地價格 (${escapeHtml(info.code)} ${escapeHtml(info.symbol)})</label>
                <button type="button" onclick="clearCalcInputs()" class="text-[11px] font-semibold text-ink-400 hover:text-ink-700">清空</button>
              </div>
              <input type="number" id="calc-foreign-input" inputmode="decimal" placeholder="輸入當地金額..." oninput="calcFromForeign(this.value, ${info.rate})" class="w-full bg-white border border-stone-200 rounded-xl px-3.5 py-3 text-xl font-bold text-ink-900 focus:outline-none focus:border-sage-500" />
              <div class="flex items-center gap-1.5 flex-wrap mt-2.5">
                ${quickBtns}
              </div>
            </div>

            <div class="flex justify-center -my-1">
              <div class="w-8 h-8 rounded-full bg-white border border-stone-200 shadow-xs flex items-center justify-center text-ink-400">
                <i data-lucide="arrow-up-down" class="w-4 h-4"></i>
              </div>
            </div>

            <!-- 台幣結果 / 反向輸入 -->
            <div class="bg-terracotta-50/70 p-3.5 rounded-2xl border border-terracotta-100">
              <div class="flex items-center justify-between mb-1">
                <label class="text-xs font-bold text-terracotta-600">約合新台幣 (TWD NT$)</label>
                <button type="button" onclick="copyCalcResult('${escapeHtml(info.symbol)}')" class="text-[11px] font-semibold text-terracotta-600 hover:underline flex items-center gap-1">
                  <i data-lucide="copy" class="w-3 h-3"></i>
                  複製結果
                </button>
              </div>
              <input type="number" id="calc-twd-input" inputmode="decimal" placeholder="0" oninput="calcFromTwd(this.value, ${info.rate})" class="w-full bg-white border border-terracotta-200 rounded-xl px-3.5 py-3 text-xl font-bold text-terracotta-600 focus:outline-none focus:border-terracotta-500" />
            </div>
          </div>

          <div class="flex items-center justify-between pt-1">
            <button type="button" onclick="openTripFormModal('${trip.id}')" class="text-xs font-semibold text-sage-600 hover:underline flex items-center gap-1">
              <i data-lucide="settings-2" class="w-3.5 h-3.5"></i>
              修改旅程匯率 (${info.rate})
            </button>
            <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-sage-500 text-white text-xs font-bold shadow-xs active:scale-95 transition">
              完成
            </button>
          </div>
        </div>
      `);
      setTimeout(() => {
        const inp = document.getElementById('calc-foreign-input');
        if (inp) inp.focus();
      }, 150);
    }

    function setCalcForeignAmount(amount, rate) {
      const fInp = document.getElementById('calc-foreign-input');
      if (fInp) {
        fInp.value = amount;
        calcFromForeign(amount, rate);
      }
    }

    function clearCalcInputs() {
      const fInp = document.getElementById('calc-foreign-input');
      const tInp = document.getElementById('calc-twd-input');
      if (fInp) fInp.value = '';
      if (tInp) tInp.value = '';
      if (fInp) fInp.focus();
    }

    function copyCalcResult(symbol) {
      const fVal = document.getElementById('calc-foreign-input')?.value;
      const tVal = document.getElementById('calc-twd-input')?.value;
      if (!fVal && !tVal) {
        showToast('請先輸入金額');
        return;
      }
      copyTextToClipboard(`${symbol}${Number(fVal || 0).toLocaleString()} ≈ NT$ ${Number(tVal || 0).toLocaleString()}`, '已複製換算結果');
    }

    function calcFromForeign(val, rate) {
      const tInp = document.getElementById('calc-twd-input');
      if (!tInp) return;
      const num = Number(val);
      if (!val || isNaN(num)) {
        tInp.value = '';
        return;
      }
      tInp.value = Math.round(num * rate);
    }

    function calcFromTwd(val, rate) {
      const fInp = document.getElementById('calc-foreign-input');
      if (!fInp) return;
      const num = Number(val);
      if (!val || isNaN(num) || rate <= 0) {
        fInp.value = '';
        return;
      }
      fInp.value = Math.round(num / rate);
    }

    // ------------------------------------------
    // 彈窗 G：安裝到手機主畫面 (PWA 教學 + 一鍵安裝)
    // ------------------------------------------
    function openInstallModal() {
      const promptBanner = deferredInstallPrompt
        ? `<button type="button" onclick="triggerNativePwaInstall()" class="w-full py-3 rounded-2xl bg-terracotta-500 text-white font-bold text-sm shadow-md hover:bg-terracotta-600 flex items-center justify-center gap-2 active:scale-[0.99] transition">
            <i data-lucide="download" class="w-4 h-4"></i>
            立即安裝到手機主畫面
          </button>`
        : '';

      openModal(`
        <div class="p-5 overflow-y-auto space-y-4">
          <div class="flex items-center justify-between border-b border-stone-100 pb-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-xl bg-terracotta-50 text-terracotta-600 flex items-center justify-center">
                <i data-lucide="smartphone" class="w-4 h-4"></i>
              </div>
              <h3 class="font-bold text-base text-ink-900">把「旅途手帳」放到手機主畫面</h3>
            </div>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-ink-600"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <p class="text-xs text-ink-600 leading-relaxed">
            本網頁支援 PWA 應用程式模式！加入主畫面後，就能像原生 App 一樣全螢幕開啟，所有行程與筆記都會自動保存在您的手機裡。
          </p>

          ${promptBanner}

          <!-- iOS 步驟 -->
          <div class="bg-cream rounded-2xl p-4 border border-stone-200/80 space-y-2">
            <h4 class="font-bold text-sm text-ink-900 flex items-center gap-1.5">
              <span class="px-2 py-0.5 rounded bg-ink-900 text-white text-[10px]">iPhone / iPad</span>
              使用 Safari 瀏覽器
            </h4>
            <ol class="text-xs text-ink-600 space-y-1.5 list-decimal list-inside leading-relaxed">
              <li>點擊畫面底部工具列的 <strong class="text-ink-900">「分享」圖示</strong>（方框向上箭頭 <i data-lucide="share" class="w-3.5 h-3.5 inline text-sky-600"></i>）。</li>
              <li>往下滑動選單，找到並點擊 <strong class="text-ink-900">「加入主畫面」</strong>。</li>
              <li>點擊右上角 <strong class="text-ink-900">「新增」</strong>，桌面就會出現專屬手帳圖示！</li>
            </ol>
          </div>

          <!-- Android 步驟 -->
          <div class="bg-cream rounded-2xl p-4 border border-stone-200/80 space-y-2">
            <h4 class="font-bold text-sm text-ink-900 flex items-center gap-1.5">
              <span class="px-2 py-0.5 rounded bg-sage-600 text-white text-[10px]">Android</span>
              使用 Chrome 瀏覽器
            </h4>
            <ol class="text-xs text-ink-600 space-y-1.5 list-decimal list-inside leading-relaxed">
              <li>點擊瀏覽器右上角的 <strong class="text-ink-900">「⋮」更多選單</strong>。</li>
              <li>選擇 <strong class="text-ink-900">「加到主畫面」</strong> 或 <strong class="text-ink-900">「安裝應用程式」</strong>。</li>
              <li>確認名稱後點擊新增即可完成。</li>
            </ol>
          </div>

          <button type="button" onclick="closeModal()" class="w-full py-3 rounded-2xl bg-sage-500 text-white font-bold text-sm shadow-md active:scale-[0.99] transition">
            我知道了！
          </button>
        </div>
      `);
    }

    async function triggerNativePwaInstall() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      closeModal();
      if (outcome === 'accepted') {
        showToast('已開始安裝「旅途手帳」App！');
      }
    }

    // ------------------------------------------
    // 彈窗 H：資料備份匯出與還原 (JSON)
    // ------------------------------------------
    function openBackupModal() {
      const jsonStr = JSON.stringify(appState, null, 2);
      openModal(`
        <div class="p-5 overflow-y-auto space-y-4">
          <div class="flex items-center justify-between border-b border-stone-100 pb-3">
            <h3 class="font-bold text-base text-ink-900">資料備份與還原</h3>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-ink-600"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <p class="text-xs text-ink-600 leading-relaxed">
            您的所有旅遊資料皆自動儲存在此裝置的瀏覽器中。您可以隨時下載 JSON 備份檔，或複製代碼分享給旅伴匯入！
          </p>

          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" onclick="downloadBackupFile()" class="py-2.5 px-3 rounded-xl bg-sage-500 text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow-xs active:scale-95 transition">
              <i data-lucide="download" class="w-4 h-4"></i>
              下載 JSON 備份
            </button>
            <button type="button" onclick="copyBackupJson()" class="py-2.5 px-3 rounded-xl bg-sage-50 text-sage-700 border border-sage-200 text-xs font-bold flex items-center justify-center gap-1.5 active:scale-95 transition">
              <i data-lucide="copy" class="w-4 h-4"></i>
              複製備份代碼
            </button>
          </div>

          <div class="border-t border-stone-100 pt-3 space-y-2">
            <label class="block text-xs font-bold text-ink-900">匯入 / 還原備份資料</label>
            <textarea id="import-json-input" rows="4" placeholder="在此貼上備份的 JSON 代碼，或選擇下方檔案上傳..." class="w-full bg-cream border border-stone-200 rounded-xl p-2.5 text-xs font-mono focus:outline-none focus:border-sage-500"></textarea>
            <div class="flex items-center gap-2">
              <label class="flex-1 py-2.5 px-3 rounded-xl bg-stone-100 text-ink-700 text-xs font-semibold text-center cursor-pointer hover:bg-stone-200 transition">
                選擇 .json 檔案
                <input type="file" accept=".json,application/json" onchange="handleImportFile(event)" class="hidden" />
              </label>
              <button type="button" onclick="importFromTextarea()" class="flex-1 py-2.5 px-3 rounded-xl bg-terracotta-500 text-white text-xs font-bold hover:bg-terracotta-600 transition">
                確認覆蓋匯入
              </button>
            </div>
          </div>

          <div class="border-t border-stone-100 pt-3 flex items-center justify-between">
            <span class="text-[11px] text-ink-400">想重新體驗範例行程？</span>
            <button type="button" onclick="confirmResetDemoData()" class="text-xs font-semibold text-rose-500 hover:underline">
              還原預設範例資料
            </button>
          </div>

          <textarea id="hidden-export-area" class="sr-only">${escapeHtml(jsonStr)}</textarea>
        </div>
      `);
    }

    function downloadBackupFile() {
      const dataStr = JSON.stringify(appState, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateTag = formatDateISO(new Date());
      a.href = url;
      a.download = `旅途手帳備份_${dateTag}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('已開始下載備份檔');
    }

    function copyBackupJson() {
      copyTextToClipboard(JSON.stringify(appState, null, 2), '已複製備份代碼到剪貼簿');
    }

    function handleImportFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (evt) {
        const input = document.getElementById('import-json-input');
        if (input) input.value = evt.target.result;
        importFromTextarea();
      };
      reader.readAsText(file);
    }

    function importFromTextarea() {
      const raw = document.getElementById('import-json-input')?.value.trim();
      if (!raw) {
        showToast('請先貼上備份內容或選擇檔案');
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.trips) || parsed.trips.length === 0) {
          throw new Error('格式不符');
        }
        parsed.trips = parsed.trips.map(normalizeTripData);
        appState = parsed;
        selectedDay = 1;
        saveState();
        closeModal();
        renderApp();
        showToast('資料已成功還原！');
      } catch (err) {
        showToast('JSON 格式錯誤，無法匯入');
      }
    }

    function confirmResetDemoData() {
      openConfirmModal('還原預設範例資料', '這將會清除目前所有自訂旅程並恢復預設的東京、首爾範例資料，確定要繼續嗎？', '確認還原', () => {
        appState = getDefaultData();
        selectedDay = 1;
        noteFilter = 'all';
        noteSearchQuery = '';
        saveState();
        renderApp();
        showToast('已還原預設範例資料');
      });
    }

    // ==========================================
    // 8. 啟動應用程式
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>

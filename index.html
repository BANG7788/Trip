<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>旅途手帳 | 旅遊行程規劃與筆記</title>

  <!-- PWA & iOS 加入主畫面設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="旅途手帳" />
  <meta name="theme-color" content="#FAF8F5" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- 內嵌 SVG 圖示 (Apple Touch Icon & Favicon) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23D96B43'/%3E%3Crect x='96' y='72' width='320' height='368' rx='36' fill='%23FAF8F5'/%3E%3Crect x='136' y='72' width='24' height='368' fill='%235A7D6C'/%3E%3Ccircle cx='286' cy='210' r='58' fill='%23D96B43'/%3E%3Cpath d='M286 172c-21 0-38 17-38 38 0 28 38 68 38 68s38-40 38-68c0-21-17-38-38-38zm0 52a14 14 0 1 1 0-28 14 14 0 0 1 0 28z' fill='%23FAF8F5'/%3E%3Crect x='204' y='316' width='164' height='18' rx='9' fill='%23EAE4DA'/%3E%3Crect x='228' y='354' width='116' height='18' rx='9' fill='%23EAE4DA'/%3E%3C/svg%3E" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23D96B43'/%3E%3Crect x='96' y='72' width='320' height='368' rx='36' fill='%23FAF8F5'/%3E%3Crect x='136' y='72' width='24' height='368' fill='%235A7D6C'/%3E%3Ccircle cx='286' cy='210' r='58' fill='%23D96B43'/%3E%3C/svg%3E" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Noto Serif TC & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PeerJS & QRCode.js CDN (跨裝置連線與 QR Code 產生) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
            serif: ['"Noto Serif TC"', 'serif'],
          },
          colors: {
            cream: '#FAF8F5',
            paper: '#FFFFFF',
            sand: '#EAE4DA',
            terra: {
              50: '#FDF4F0',
              100: '#FAE4DA',
              200: '#F4C6B3',
              500: '#D96B43',
              600: '#C25832',
              700: '#A34625',
            },
            sage: {
              50: '#F1F6F3',
              100: '#DCE9E2',
              200: '#BAD3C6',
              500: '#5A7D6C',
              600: '#496758',
              700: '#395246',
            },
            charcoal: {
              900: '#2B2927',
              700: '#4A4642',
              500: '#78726B',
              400: '#9E978E',
            }
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(43, 41, 39, 0.05)',
            'float': '0 8px 25px -4px rgba(217, 107, 67, 0.32)',
            'nav': '0 -4px 20px rgba(43, 41, 39, 0.05)',
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      background-color: #FAF8F5;
      color: #2B2927;
      font-family: 'Noto Sans TC', sans-serif;
      overscroll-behavior-y: none;
      padding-top: var(--sat);
    }

    .font-editorial {
      font-family: 'Noto Serif TC', serif;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .pb-safe {
      padding-bottom: calc(5.5rem + var(--sab));
    }
    @media (min-width: 768px) {
      .pb-safe {
        padding-bottom: 2.5rem;
      }
    }
    .nav-safe {
      padding-bottom: max(0.5rem, var(--sab));
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-view {
      animation: fadeSlideUp 0.24s ease-out forwards;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes sheetSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes dialogZoomIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-backdrop {
      animation: modalFadeIn 0.2s ease-out forwards;
    }
    .responsive-dialog {
      animation: sheetSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @media (min-width: 768px) {
      .responsive-dialog {
        animation: dialogZoomIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    }

    .journal-dots {
      background-image: radial-gradient(#EAE4DA 1.25px, transparent 1.25px);
      background-size: 16px 16px;
    }

    #sync-qrcode-box img,
    #sync-qrcode-box canvas {
      margin: 0 auto;
      border-radius: 0.75rem;
    }
  </style>
</head>
<body class="min-h-screen bg-cream selection:bg-terra-200/60">

  <!-- 雙模式響應式外框：手機 (<768px) 單欄 App；電腦 (>=768px) 左側側邊欄 + 右側主工作區 -->
  <div id="app" class="w-full max-w-[1400px] mx-auto min-h-screen bg-cream relative flex flex-col md:flex-row">

    <!-- ==========================================
         電腦模式：左側固定側邊欄 (Desktop Sidebar, >=768px)
         ========================================== -->
    <aside class="hidden md:flex md:w-72 lg:w-80 md:shrink-0 md:flex-col md:sticky md:top-0 md:h-screen bg-paper/95 backdrop-blur-md border-r border-sand p-5 justify-between overflow-y-auto z-30">
      <div class="space-y-5">
        <!-- App Logo -->
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-2xl bg-terra-500 text-white flex items-center justify-center shadow-sm">
              <i data-lucide="book-open-check" class="w-5 h-5"></i>
            </div>
            <div>
              <span class="font-editorial font-black text-base text-charcoal-900 tracking-tight block leading-none">旅途手帳</span>
              <span class="text-[10px] font-bold tracking-widest uppercase text-charcoal-400 mt-1 block">TabiNote Journal</span>
            </div>
          </div>
          <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-terra-50 text-terra-600 border border-terra-200/70">桌面版</span>
        </div>

        <!-- 旅程切換器與匯率資訊卡片 -->
        <div class="bg-cream rounded-2xl p-3.5 border border-sand space-y-2.5">
          <button type="button" onclick="openTripSelector()" class="w-full flex items-center gap-3 text-left group">
            <div id="sidebar-trip-badge" class="w-10 h-10 rounded-xl bg-terra-500 text-white flex items-center justify-center shrink-0 shadow-xs transition-colors">
              <i data-lucide="compass" class="w-5 h-5"></i>
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-1">
                <span id="sidebar-trip-title" class="font-bold text-sm text-charcoal-900 truncate group-hover:text-terra-600 transition">載入中...</span>
                <i data-lucide="chevrons-up-down" class="w-4 h-4 text-charcoal-400 shrink-0"></i>
              </div>
              <p id="sidebar-trip-subtitle" class="text-[11px] text-charcoal-500 truncate mt-0.5">準備出發</p>
            </div>
          </button>

          <!-- 目前匯率卡片 -->
          <div onclick="openTripFormModal(appState.currentTripId)" class="flex items-center justify-between bg-paper px-3 py-2 rounded-xl border border-sand text-[11px] cursor-pointer hover:border-terra-300 transition">
            <span class="text-charcoal-700 font-medium flex items-center gap-1.5 truncate">
              <i data-lucide="coins" class="w-3.5 h-3.5 text-terra-500 shrink-0"></i>
              <span id="sidebar-rate-text" class="truncate">1 JPY = 0.215 TWD</span>
            </span>
            <span class="text-sage-600 font-bold shrink-0 ml-1">調整</span>
          </div>

          <button type="button" onclick="openTripFormModal()" class="w-full py-2 px-3 rounded-xl bg-terra-500 text-white text-xs font-bold hover:bg-terra-600 flex items-center justify-center gap-1.5 shadow-xs transition">
            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
            <span>建立新旅程</span>
          </button>
        </div>

        <!-- 四大分頁導覽選單 (含即時徽章) -->
        <nav class="space-y-1">
          <p class="px-2.5 text-[11px] font-bold text-charcoal-400 uppercase tracking-wider mb-1.5">行程與手帳管理</p>
          <button type="button" onclick="switchTab('overview')" data-tab="overview" class="sidebar-nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium text-charcoal-700 hover:bg-cream transition">
            <span class="flex items-center gap-3">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
              <span>行程總覽</span>
            </span>
          </button>
          <button type="button" onclick="switchTab('itinerary')" data-tab="itinerary" class="sidebar-nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium text-charcoal-700 hover:bg-cream transition">
            <span class="flex items-center gap-3">
              <i data-lucide="calendar-days" class="w-4 h-4"></i>
              <span>每日行程</span>
            </span>
            <span id="sidebar-badge-itinerary" class="text-[11px] px-2 py-0.5 rounded-full bg-cream border border-sand text-charcoal-700 font-semibold">0</span>
          </button>
          <button type="button" onclick="switchTab('notes')" data-tab="notes" class="sidebar-nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium text-charcoal-700 hover:bg-cream transition">
            <span class="flex items-center gap-3">
              <i data-lucide="notebook-pen" class="w-4 h-4"></i>
              <span>隨手筆記</span>
            </span>
            <span id="sidebar-badge-notes" class="text-[11px] px-2 py-0.5 rounded-full bg-cream border border-sand text-charcoal-700 font-semibold">0</span>
          </button>
          <button type="button" onclick="switchTab('checklist')" data-tab="checklist" class="sidebar-nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium text-charcoal-700 hover:bg-cream transition">
            <span class="flex items-center gap-3">
              <i data-lucide="check-square" class="w-4 h-4"></i>
              <span>行李清單</span>
            </span>
            <span id="sidebar-badge-checklist" class="text-[11px] px-2 py-0.5 rounded-full bg-cream border border-sand text-charcoal-700 font-semibold">0%</span>
          </button>
        </nav>
      </div>

      <!-- 側邊欄底部工具區 -->
      <div class="pt-4 border-t border-sand space-y-1.5">
        <p class="px-2.5 text-[11px] font-bold text-charcoal-400 uppercase tracking-wider mb-1">隨身工具與同步</p>
        <button type="button" onclick="openCurrencyCalculator()" class="w-full flex items-center gap-3 px-3.5 py-2 rounded-xl text-xs font-semibold text-charcoal-700 hover:bg-sage-50 hover:text-sage-700 transition">
          <i data-lucide="calculator" class="w-4 h-4 text-sage-500"></i>
          <span>匯率速算機</span>
        </button>
        <button type="button" onclick="openSyncModal('text')" class="w-full flex items-center justify-between px-3.5 py-2 rounded-xl text-xs font-semibold text-terra-600 bg-terra-50/70 hover:bg-terra-50 border border-terra-100 transition">
          <span class="flex items-center gap-3">
            <i data-lucide="repeat" class="w-4 h-4 text-terra-500"></i>
            <span>雙機同步與空間</span>
          </span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-terra-500 text-white font-bold">同步碼</span>
        </button>
        <button type="button" onclick="openInstallModal()" class="w-full flex items-center gap-3 px-3.5 py-2 rounded-xl text-xs font-semibold text-charcoal-500 hover:bg-cream hover:text-charcoal-900 transition">
          <i data-lucide="smartphone" class="w-4 h-4"></i>
          <span>加入手機主畫面 (PWA)</span>
        </button>
      </div>
    </aside>

    <!-- ==========================================
         右側主工作區容器
         ========================================== -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen">

      <!-- 手機模式頂部精簡導覽列 (< 768px) -->
      <header class="md:hidden sticky top-0 z-30 bg-cream/95 backdrop-blur-md border-b border-sand px-3.5 py-2.5 flex items-center justify-between gap-1.5">
        <button type="button" onclick="openTripSelector()" class="flex items-center gap-2 text-left min-w-0 flex-1 py-1 px-1.5 -ml-1.5 rounded-xl hover:bg-sand/40 active:scale-[0.99] transition">
          <div id="header-trip-badge" class="w-8 h-8 rounded-xl bg-terra-500 text-white flex items-center justify-center shrink-0 shadow-xs">
            <i data-lucide="compass" class="w-4 h-4"></i>
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1">
              <h1 id="header-trip-title" class="font-bold text-sm text-charcoal-900 truncate">載入中...</h1>
              <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-charcoal-400 shrink-0"></i>
            </div>
            <p id="header-trip-subtitle" class="text-[10px] text-charcoal-500 truncate">準備出發</p>
          </div>
        </button>

        <!-- 手機版右上功能鍵：匯率速算、雙機同步、PWA 安裝 -->
        <div class="flex items-center gap-1 shrink-0">
          <button type="button" onclick="openCurrencyCalculator()" title="匯率速算" class="flex items-center gap-1 bg-sage-50 text-sage-600 border border-sage-200 px-2 py-1.5 rounded-full text-[11px] font-bold hover:bg-sage-100 active:scale-95 transition">
            <i data-lucide="calculator" class="w-3.5 h-3.5"></i>
            <span class="hidden min-[360px]:inline">速算</span>
          </button>
          <button type="button" onclick="openSyncModal('text')" title="雙機同步與空間" class="flex items-center gap-1 bg-terra-50 text-terra-600 border border-terra-200 px-2 py-1.5 rounded-full text-[11px] font-bold hover:bg-terra-100 active:scale-95 transition">
            <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
            <span class="hidden min-[390px]:inline">同步</span>
          </button>
          <button type="button" onclick="openInstallModal()" title="加入主畫面" class="p-1.5 rounded-full bg-paper border border-sand text-charcoal-700 hover:bg-sand/40 active:scale-95 transition">
            <i data-lucide="smartphone" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <!-- 電腦模式頂部工作列 (>= 768px) -->
      <header class="hidden md:flex sticky top-0 z-20 bg-cream/95 backdrop-blur-md border-b border-sand px-8 py-4 items-center justify-between gap-4">
        <div class="min-w-0">
          <div class="flex items-center gap-2.5">
            <h1 id="desktop-page-title" class="font-editorial font-bold text-xl text-charcoal-900 tracking-tight">行程總覽</h1>
            <span id="desktop-trip-pill" class="text-xs font-semibold px-3 py-0.5 rounded-full bg-paper border border-sand text-charcoal-700 truncate">東京賞楓與咖啡巡禮 4 日遊</span>
          </div>
          <p id="desktop-page-desc" class="text-xs text-charcoal-500 mt-0.5">檢視旅程倒數、預算與每日行程總覽</p>
        </div>

        <div class="flex items-center gap-2.5 shrink-0">
          <button type="button" onclick="openSyncModal('text')" class="flex items-center gap-1.5 bg-paper text-terra-600 border border-terra-200 px-3.5 py-2 rounded-xl text-xs font-bold hover:bg-terra-50 shadow-2xs transition">
            <i data-lucide="repeat" class="w-4 h-4"></i>
            <span>雙機同步</span>
          </button>
          <button type="button" onclick="openCurrencyCalculator()" class="flex items-center gap-1.5 bg-paper text-charcoal-700 border border-sand px-3.5 py-2 rounded-xl text-xs font-bold hover:bg-sand/30 shadow-2xs transition">
            <i data-lucide="calculator" class="w-4 h-4 text-sage-500"></i>
            <span>匯率速算</span>
          </button>
          <button type="button" id="desktop-primary-action-btn" onclick="handleDesktopPrimaryAction()" class="flex items-center gap-1.5 bg-terra-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-xs hover:bg-terra-600 active:scale-[0.99] transition">
            <i data-lucide="pencil" class="w-4 h-4"></i>
            <span>編輯旅程設定</span>
          </button>
        </div>
      </header>

      <!-- 主內容區域 -->
      <main id="main-content" class="flex-1 w-full max-w-md md:max-w-5xl mx-auto px-4 md:px-8 pt-4 md:pt-6 pb-safe overflow-x-hidden">
        <!-- 由 JavaScript 動態渲染 -->
      </main>
    </div>

    <!-- 手機模式：懸浮新增按鈕 (FAB, < 768px) -->
    <button type="button" id="fab-btn" onclick="handleFabClick()" class="md:hidden fixed bottom-20 right-4 z-30 w-14 h-14 rounded-full bg-terra-500 text-white shadow-float flex items-center justify-center hover:bg-terra-600 active:scale-90 transition-all" style="margin-bottom: var(--sab);">
      <i data-lucide="plus" class="w-7 h-7"></i>
    </button>

    <!-- 手機模式：底部四分頁導覽列 (< 768px) -->
    <nav class="md:hidden fixed bottom-0 inset-x-0 w-full z-30 bg-paper/95 backdrop-blur-md border-t border-sand shadow-nav nav-safe">
      <div class="grid grid-cols-4 h-14 max-w-md mx-auto">
        <button type="button" onclick="switchTab('overview')" data-tab="overview" class="nav-item flex flex-col items-center justify-center gap-0.5 text-terra-500 font-bold transition">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span class="text-[11px]">總覽</span>
        </button>
        <button type="button" onclick="switchTab('itinerary')" data-tab="itinerary" class="nav-item flex flex-col items-center justify-center gap-0.5 text-charcoal-400 font-medium transition">
          <i data-lucide="calendar-days" class="w-5 h-5"></i>
          <span class="text-[11px]">每日行程</span>
        </button>
        <button type="button" onclick="switchTab('notes')" data-tab="notes" class="nav-item flex flex-col items-center justify-center gap-0.5 text-charcoal-400 font-medium transition">
          <i data-lucide="notebook-pen" class="w-5 h-5"></i>
          <span class="text-[11px]">隨手筆記</span>
        </button>
        <button type="button" onclick="switchTab('checklist')" data-tab="checklist" class="nav-item flex flex-col items-center justify-center gap-0.5 text-charcoal-400 font-medium transition">
          <i data-lucide="check-square" class="w-5 h-5"></i>
          <span class="text-[11px]">行李清單</span>
        </button>
      </div>
    </nav>

    <!-- 響應式通用彈窗 (手機 Bottom Sheet / 電腦 Centered Modal) -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden flex items-end md:items-center justify-center md:p-6">
      <div onclick="closeModal()" class="modal-backdrop absolute inset-0 bg-charcoal-900/45 backdrop-blur-[2px]"></div>
      <div id="modal-body" class="responsive-dialog relative z-10 w-full max-w-md md:max-w-xl bg-paper rounded-t-3xl md:rounded-3xl shadow-2xl border border-sand max-h-[90vh] flex flex-col overflow-hidden">
        <!-- 動態內容 -->
      </div>
    </div>

    <!-- 輕量提示吐司 (Toast) -->
    <div id="toast" class="fixed top-16 md:top-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 transform -translate-y-2">
      <div class="bg-charcoal-900/95 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 backdrop-blur-sm">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-terra-200"></i>
        <span id="toast-message">已儲存</span>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. PWA Manifest 與安裝提示初始化
    // ==========================================
    let deferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
    });

    (function setupDynamicManifest() {
      try {
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#D96B43"/><rect x="96" y="72" width="320" height="368" rx="36" fill="#FAF8F5"/><rect x="136" y="72" width="24" height="368" fill="#5A7D6C"/><circle cx="286" cy="210" r="58" fill="#D96B43"/><path d="M286 172c-21 0-38 17-38 38 0 28 38 68 38 68s38-40 38-68c0-21-17-38-38-38zm0 52a14 14 0 1 1 0-28 14 14 0 0 1 0 28z" fill="#FAF8F5"/></svg>`;

    function normalizeTripData(trip) {
      if (!trip) return trip;
      const code = (trip.currency || 'TWD').toUpperCase();
      const preset = CURRENCY_PRESETS.find(p => p.code === code);
      trip.currency = code;
      trip.currencySymbol = trip.currencySymbol || (preset ? preset.symbol : `${code} `);
      trip.exchangeRate = code === 'TWD' ? 1 : (Number(trip.exchangeRate) > 0 ? Number(trip.exchangeRate) : (preset ? preset.defaultRate : 1));
      trip.days = Math.max(1, Number(trip.days) || 1);
      trip.updatedAt = Number(trip.updatedAt) || Date.now();
      trip.itinerary = Array.isArray(trip.itinerary) ? trip.itinerary : [];
      trip.notes = Array.isArray(trip.notes) ? trip.notes : [];
      trip.checklist = Array.isArray(trip.checklist) ? trip.checklist : [];
      return trip;
    }

    function openTabiNoteDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('瀏覽器不支援 IndexedDB'));
          return;
        }
        try {
          const req = window.indexedDB.open(IDB_NAME, IDB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) {
              db.createObjectStore(IDB_STORE);
            }
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = (e) => reject(e.target.error || new Error('IndexedDB 開啟失敗'));
        } catch (err) {
          reject(err);
        }
      });
    }

    async function readFromIDB() {
      const db = await openTabiNoteDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const store = tx.objectStore(IDB_STORE);
        const req = store.get(IDB_RECORD_KEY);
        req.onsuccess = () => {
          db.close();
          resolve(req.result || null);
        };
        req.onerror = () => {
          db.close();
          reject(req.error);
        };
      });
    }

    async function writeToIDB(data) {
      const db = await openTabiNoteDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        const req = store.put(data, IDB_RECORD_KEY);
        req.onsuccess = () => {
          db.close();
          resolve(true);
        };
        req.onerror = () => {
          db.close();
          reject(req.error);
        };
      });
    }

    function findLegacyLocalStorageData() {
      for (const key of LEGACY_KEYS) {
        try {
          const raw = localStorage.getItem(key);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.trips) && parsed.trips.length > 0) {
              parsed.trips = parsed.trips.map(normalizeTripData);
              return { key, data: parsed };
            }
          }
        } catch (e) {
          console.warn('讀取舊版 localStorage 略過:', key, e);
        }
      }
      return null;
    }

    async function initStorageAndLoadState() {
      try {
        const idbData = await readFromIDB();
        if (idbData && Array.isArray(idbData.trips) && idbData.trips.length > 0) {
          idbData.trips = idbData.trips.map(normalizeTripData);
          appState = idbData;
          storageEngineMode = 'indexeddb';
          return;
        }

        // 自動偵測舊版 localStorage 資料並無縫遷移至 IndexedDB
        const legacy = findLegacyLocalStorageData();
        if (legacy) {
          appState = legacy.data;
          storageEngineMode = 'indexeddb';
          await writeToIDB(appState);
          setTimeout(() => showToast('已自動將舊資料無縫升級至 IndexedDB 大容量資料庫！'), 400);
          return;
        }

        // 初次使用：載入範例資料並寫入 IndexedDB
        appState = getDefaultData();
        storageEngineMode = 'indexeddb';
        await writeToIDB(appState);
      } catch (err) {
        console.warn('IndexedDB 無法使用（可能為無痕模式），自動降級至 localStorage:', err);
        storageEngineMode = 'localstorage';
        const legacy = findLegacyLocalStorageData();
        if (legacy) {
          appState = legacy.data;
        } else {
          appState = getDefaultData();
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
          } catch (e) {}
        }
        setTimeout(() => showToast('目前處於相容儲存模式（建議定期匯出 JSON 備份）'), 500);
      }
    }

    function saveState(stateToSave = appState, touchCurrentTrip = true) {
      if (touchCurrentTrip && stateToSave === appState) {
        const cur = stateToSave.trips.find(t => t.id === stateToSave.currentTripId);
        if (cur) cur.updatedAt = Date.now();
      }

      if (storageEngineMode === 'indexeddb') {
        writeToIDB(stateToSave).catch((err) => {
          console.error('寫入 IndexedDB 失敗，嘗試降級寫入 localStorage:', err);
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
          } catch (lsErr) {
            showToast('本機儲存空間已滿，請開啟「雙機同步」清理舊圖片');
          }
        });
      } else {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
        } catch (e) {
          console.error('儲存資料失敗:', e);
          showToast('儲存空間已滿（5MB 上限），請開啟「雙機同步」清理圖片');
        }
      }
    }

    function getCurrentTrip() {
      let trip = appState.trips.find(t => t.id === appState.currentTripId);
      if (!trip && appState.trips.length > 0) {
        trip = appState.trips[0];
        appState.currentTripId = trip.id;
        saveState(appState, false);
      }
      return normalizeTripData(trip);
    }

    // ==========================================
    // 5. 通用工具函式與文字同步碼壓縮編解碼器
    // ==========================================
    function generateId(prefix = 'id') {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`;
    }

    function formatDateISO(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      if (!toast || !toastMsg) return;
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
      }, 2500);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function copyTextToClipboard(text, successMsg = '已複製到剪貼簿') {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      let ok = false;
      try {
        ok = document.execCommand('copy');
        if (ok && successMsg) showToast(successMsg);
      } catch (err) {
        if (successMsg) showToast('複製失敗，請手動選取複製');
      }
      document.body.removeChild(textarea);
      return ok;
    }

    // 內建文字同步碼編碼器（支援瀏覽器原生 CompressionStream deflate-raw 壓縮 + UTF-8 Base64URL）
    function bytesToBase64Url(uint8Array) {
      let binary = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < uint8Array.length; i += chunkSize) {
        const sub = uint8Array.subarray(i, i + chunkSize);
        binary += String.fromCharCode.apply(null, sub);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function base64UrlToBytes(b64Url) {
      let b64 = b64Url.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4 !== 0) {
        b64 += '=';
      }
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function encodeStateToTextSyncCode(stateObj) {
      const jsonStr = JSON.stringify(stateObj);
      const utf8Bytes = new TextEncoder().encode(jsonStr);

      if (typeof CompressionStream === 'function') {
        try {
          const cs = new CompressionStream('deflate-raw');
          const writer = cs.writable.getWriter();
          writer.write(utf8Bytes);
          writer.close();
          const compressedBuf = await new Response(cs.readable).arrayBuffer();
          const compressedBytes = new Uint8Array(compressedBuf);
          const payloadB64 = bytesToBase64Url(compressedBytes);
          return `${TEXT_SYNC_PREFIX}Z1:${payloadB64}`;
        } catch (e) {
          console.warn('CompressionStream 壓縮略過，改用 UTF-8 Base64:', e);
        }
      }

      const plainB64 = bytesToBase64Url(utf8Bytes);
      return `${TEXT_SYNC_PREFIX}U1:${plainB64}`;
    }

    async function decodeTextSyncCodeToState(rawInput) {
      const trimmed = (rawInput || '').trim().replace(/\s+/g, '');
      if (!trimmed.startsWith(TEXT_SYNC_PREFIX)) {
        throw new Error('同步碼格式錯誤：必須以「TABINOTE:」開頭');
      }
      const body = trimmed.slice(TEXT_SYNC_PREFIX.length);
      let jsonStr = '';

      if (body.startsWith('Z1:')) {
        const b64Part = body.slice(3);
        const compressedBytes = base64UrlToBytes(b64Part);
        if (typeof DecompressionStream !== 'function') {
          throw new Error('目前瀏覽器不支援壓縮格式解碼，請改用 JSON 檔案匯入');
        }
        const ds = new DecompressionStream('deflate-raw');
        const writer = ds.writable.getWriter();
        writer.write(compressedBytes);
        writer.close();
        const decompressedBuf = await new Response(ds.readable).arrayBuffer();
        jsonStr = new TextDecoder().decode(decompressedBuf);
      } else if (body.startsWith('U1:')) {
        const b64Part = body.slice(3);
        const utf8Bytes = base64UrlToBytes(b64Part);
        jsonStr = new TextDecoder().decode(utf8Bytes);
      } else {
        // 相容無版本前綴的純 Base64 UTF-8 格式
        const utf8Bytes = base64UrlToBytes(body);
        jsonStr = new TextDecoder().decode(utf8Bytes);
      }

      const parsed = JSON.parse(jsonStr);
      if (!parsed || !Array.isArray(parsed.trips) || parsed.trips.length === 0) {
        throw new Error('同步碼內容缺少有效的旅程資料');
      }
      return parsed;
    }

    function getDayDateInfo(startDateStr, dayNum) {
      if (!startDateStr) return { dateText: `第 ${dayNum} 天`, weekday: '', fullDate: '' };
      const parts = startDateStr.split('-');
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      d.setDate(d.getDate() + (dayNum - 1));
      const month = d.getMonth() + 1;
      const date = d.getDate();
      const weekdays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      return {
        dateText: `${month}/${date}`,
        weekday: weekdays[d.getDay()],
        fullDate: `${d.getFullYear()}/${String(month).padStart(2, '0')}/${String(date).padStart(2, '0')}`
      };
    }

    function calcDaysBetween(startStr, endStr) {
      if (!startStr || !endStr) return 1;
      const s = startStr.split('-').map(Number);
      const e = endStr.split('-').map(Number);
      const d1 = new Date(s[0], s[1] - 1, s[2]);
      const d2 = new Date(e[0], e[1] - 1, e[2]);
      const diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
      return Math.max(1, Math.min(60, diff || 1));
    }

    function getEndDateISO(startStr, days) {
      if (!startStr) return '';
      const parts = startStr.split('-').map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + (Math.max(1, Number(days) || 1) - 1));
      return formatDateISO(d);
    }

    function getCountdownBadge(startDateStr, days) {
      if (!startDateStr) return '規劃中';
      const parts = startDateStr.split('-');
      const start = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const diffDays = Math.round((start - now) / (1000 * 60 * 60 * 24));

      if (diffDays > 0) return `倒數 ${diffDays} 天出發`;
      if (diffDays === 0) return `就是今天出發！🎉`;
      if (diffDays < 0 && Math.abs(diffDays) < days) return `旅程第 ${Math.abs(diffDays) + 1} 天進行中 ✨`;
      return `美好回憶已收藏`;
    }

    function openGoogleMaps(locationQuery) {
      if (!locationQuery) return;
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(locationQuery)}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    function getTripCurrencyInfo(trip) {
      const code = (trip?.currency || 'TWD').toUpperCase();
      const preset = CURRENCY_PRESETS.find(p => p.code === code);
      const symbol = trip?.currencySymbol || (preset ? preset.symbol : `${code} `);
      const rate = code === 'TWD' ? 1 : (Number(trip?.exchangeRate) > 0 ? Number(trip.exchangeRate) : (preset ? preset.defaultRate : 1));
      const isTWD = code === 'TWD';
      return { code, symbol, rate, isTWD };
    }

    function formatMoneyWithTwd(amount, trip) {
      const num = Number(amount) || 0;
      const { code, symbol, rate, isTWD } = getTripCurrencyInfo(trip);
      const localFormatted = `${symbol} ${num.toLocaleString()}`;
      if (isTWD) {
        return {
          localText: `NT$ ${num.toLocaleString()}`,
          twdText: '',
          twdValue: num,
          isTWD: true,
          code,
          symbol,
          rate
        };
      }
      const twdValue = Math.round(num * rate);
      return {
        localText: localFormatted,
        twdText: `≈ NT$ ${twdValue.toLocaleString()}`,
        twdValue,
        isTWD: false,
        code,
        symbol,
        rate
      };
    }

    function executePendingConfirm() {

            <div onclick="switchTab('itinerary')" class="bg-paper p-4 rounded-2xl shadow-soft border border-sand hover:border-terra-200 active:scale-[0.98] transition cursor-pointer">
              <div class="flex items-center justify-between text-charcoal-500 mb-1.5">
                <span class="text-xs font-semibold">預估總花費</span>
                <i data-lucide="coins" class="w-4 h-4 text-terra-500"></i>
              </div>
              <div class="text-lg font-extrabold text-charcoal-900 truncate leading-tight">
                ${totalMoney.localText}
              </div>
              ${
                !totalMoney.isTWD
                  ? `<div class="text-xs font-bold text-terra-600 mt-0.5 truncate">${totalMoney.twdText}</div>`
                  : `<div class="text-[11px] text-charcoal-400 mt-0.5">新台幣總計</div>`
              }
            </div>

            <div onclick="switchTab('notes')" class="bg-paper p-4 rounded-2xl shadow-soft border border-sand hover:border-terra-200 active:scale-[0.98] transition cursor-pointer">
              <div class="flex items-center justify-between text-charcoal-500 mb-1.5">
                <span class="text-xs font-semibold">隨手筆記</span>
                <i data-lucide="sticky-note" class="w-4 h-4 text-amber-500"></i>
              </div>
              <div class="text-xl font-extrabold text-charcoal-900">${totalNotes} <span class="text-xs font-normal text-charcoal-400">則紀錄</span></div>
            </div>

            <div onclick="switchTab('checklist')" class="bg-paper p-4 rounded-2xl shadow-soft border border-sand hover:border-terra-200 active:scale-[0.98] transition cursor-pointer">
              <div class="flex items-center justify-between text-charcoal-500 mb-1.5">
                <span class="text-xs font-semibold">行李準備度</span>
                <i data-lucide="luggage" class="w-4 h-4 text-sky-600"></i>
              </div>
              <div class="flex items-baseline justify-between">
                <span class="text-xl font-extrabold text-charcoal-900">${checkPercent}%</span>
                <span class="text-[11px] text-charcoal-400">${checkedCount}/${totalCheck}</span>
              </div>
              <div class="w-full h-1.5 bg-cream rounded-full overflow-hidden mt-2 border border-sand/60">
                <div class="h-full bg-sage-500 rounded-full transition-all duration-300" style="width: ${checkPercent}%"></div>
              </div>
            </div>
          </div>

          <!-- 電腦雙欄：左側每日行程一覽 / 右側最近隨手筆記 -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 pt-1">
            <div class="lg:col-span-7">
              <div class="flex items-center justify-between mb-2.5 px-1">
                <h3 class="font-bold text-sm text-charcoal-900 flex items-center gap-1.5">
                  <i data-lucide="calendar-range" class="w-4 h-4 text-terra-500"></i>
                  每日行程一覽
                </h3>
                <button type="button" onclick="switchTab('itinerary')" class="text-xs font-bold text-sage-600 hover:underline">進入時間軸 →</button>
              </div>
              <div class="space-y-2.5">
                ${dailyPreviewHtml}
              </div>
            </div>

            <div class="hidden lg:block lg:col-span-5">
              <div class="flex items-center justify-between mb-2.5 px-1">
                <h3 class="font-bold text-sm text-charcoal-900 flex items-center gap-1.5">
                  <i data-lucide="notebook-pen" class="w-4 h-4 text-sage-500"></i>
                  最近隨手筆記
                </h3>
                <button type="button" onclick="switchTab('notes')" class="text-xs font-bold text-sage-600 hover:underline">查看全部 (${totalNotes}) →</button>
              </div>
              <div class="space-y-2.5">
                ${recentNotesHtml}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function jumpToDay(dayNum) {
      selectedDay = dayNum;
      switchTab('itinerary');
    }

    // ------------------------------------------
    // 分頁 2：每日行程 (Itinerary Timeline)
    // ------------------------------------------
    function renderItineraryView(trip, theme) {
      let dayTabsHtml = '';
      for (let d = 1; d <= trip.days; d++) {
        const isSelected = d === selectedDay;
        const info = getDayDateInfo(trip.startDate, d);
        dayTabsHtml += `
          <button type="button" onclick="selectDay(${d})" class="shrink-0 px-4 py-2 rounded-2xl border transition-all flex flex-col items-center min-w-[78px] md:min-w-[94px] ${
            isSelected
              ? `${theme.bg} text-white border-transparent shadow-xs scale-[1.02]`
              : 'bg-paper text-charcoal-700 border-sand hover:bg-cream'
          }">
            <span class="text-xs font-extrabold">Day ${d}</span>
            <span class="text-[11px] ${isSelected ? 'text-white/90' : 'text-charcoal-400'} mt-0.5">${info.dateText} ${info.weekday}</span>
          </button>
        `;
      }
      dayTabsHtml += `
        <button type="button" onclick="addExtraDay()" title="增加一天行程" class="shrink-0 px-3.5 py-2 rounded-2xl border border-dashed border-charcoal-400/50 bg-paper/80 text-charcoal-700 hover:bg-paper hover:border-terra-500 transition-all flex flex-col items-center justify-center min-w-[70px]">
          <i data-lucide="plus" class="w-4 h-4 text-terra-500"></i>
          <span class="text-[11px] font-bold mt-0.5">加一天</span>
        </button>
      `;

      const dayActivities = trip.itinerary
        .filter(a => a.day === selectedDay)
        .sort((a, b) => a.time.localeCompare(b.time));

      const dayCost = dayActivities.reduce((sum, a) => sum + (Number(a.cost) || 0), 0);
      const dayMoney = formatMoneyWithTwd(dayCost, trip);
      const currentDayInfo = getDayDateInfo(trip.startDate, selectedDay);

      const catBreakdownHtml = Object.entries(ACTIVITY_CATEGORIES)
        .map(([k, cat]) => {
          const catSum = dayActivities
            .filter(a => a.category === k)
            .reduce((s, a) => s + (Number(a.cost) || 0), 0);
          if (catSum <= 0) return '';
          const m = formatMoneyWithTwd(catSum, trip);
          return `
            <div class="flex items-center justify-between text-xs py-1.5 border-b border-sand/60 last:border-none">
              <span class="inline-flex items-center gap-1.5 font-semibold text-charcoal-700">
                <span class="w-5 h-5 rounded-md ${cat.bg} ${cat.text} flex items-center justify-center">
                  <i data-lucide="${cat.icon}" class="w-3 h-3"></i>
                </span>
                ${cat.label}
              </span>
              <div class="text-right">
                <span class="font-bold text-charcoal-900">${m.localText}</span>
                ${!m.isTWD ? `<span class="text-[10px] text-terra-600 ml-1">${m.twdText}</span>` : ''}
              </div>
            </div>
          `;
        })
        .join('');

      let timelineHtml = '';
      if (dayActivities.length === 0) {
        timelineHtml = `
          <div class="bg-paper rounded-3xl p-8 text-center border border-dashed border-sand my-2">
            <div class="w-12 h-12 rounded-2xl bg-terra-50 text-terra-500 flex items-center justify-center mx-auto mb-3">
              <i data-lucide="calendar-plus" class="w-6 h-6"></i>
            </div>
            <h4 class="font-bold text-charcoal-900 text-sm mb-1">Day ${selectedDay} 還是空的喔！</h4>
            <p class="text-xs text-charcoal-500 mb-4">點擊新增按鈕，開始安排這天的景點、美食或交通吧</p>
            <button type="button" onclick="openActivityModal()" class="px-4 py-2 rounded-xl ${theme.bg} text-white text-xs font-bold shadow-xs active:scale-95 transition">
              + 新增第一個行程
            </button>
          </div>
        `;
      } else {
        timelineHtml = `<div class="relative pl-4 space-y-4 before:content-[''] before:absolute before:left-[23px] before:top-4 before:bottom-4 before:w-0.5 before:bg-sand">`;
        dayActivities.forEach(act => {
          const cat = ACTIVITY_CATEGORIES[act.category] || ACTIVITY_CATEGORIES.sightseeing;
          const actCostNum = Number(act.cost) || 0;
          const actMoney = formatMoneyWithTwd(actCostNum, trip);
          timelineHtml += `
            <div class="relative flex gap-3.5 group">
              <div class="relative z-10 w-4 h-4 rounded-full bg-paper border-4 border-terra-500 mt-4 shrink-0 shadow-2xs"></div>

              <div class="flex-1 bg-paper rounded-2xl p-4 shadow-soft border border-sand hover:border-terra-200 transition">
                <div class="flex items-start justify-between gap-2 mb-1.5">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-lg bg-cream border border-sand text-charcoal-900 font-mono">${escapeHtml(act.time)}</span>
                    <span class="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full ${cat.bg} ${cat.text}">
                      <i data-lucide="${cat.icon}" class="w-3 h-3"></i>
                      ${cat.label}
                    </span>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    <button type="button" onclick="openActivityModal('${act.id}')" class="p-1.5 text-charcoal-400 hover:text-sage-600 rounded-lg hover:bg-cream transition" title="編輯">
                      <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                    </button>
                    <button type="button" onclick="confirmDeleteActivity('${act.id}')" class="p-1.5 text-charcoal-400 hover:text-rose-500 rounded-lg hover:bg-rose-50 transition" title="刪除">
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>

                <h4 class="font-bold text-base text-charcoal-900 leading-snug mb-1">${escapeHtml(act.title)}</h4>

                ${act.note ? `<p class="text-xs text-charcoal-700 leading-relaxed mb-3 bg-cream p-2.5 rounded-xl border border-sand/80 whitespace-pre-line">${escapeHtml(act.note)}</p>` : ''}

                <div class="flex items-center justify-between gap-2 pt-2 border-t border-sand/70 mt-2">
                  ${
                    act.location
                      ? `<button type="button" data-loc="${escapeHtml(act.location)}" onclick="openGoogleMaps(this.dataset.loc)" class="inline-flex items-center gap-1.5 text-xs font-bold text-sage-700 bg-sage-50 hover:bg-sage-100 px-2.5 py-1.5 rounded-xl transition active:scale-95 min-w-0">
                          <i data-lucide="navigation" class="w-3.5 h-3.5 shrink-0"></i>
                          <span class="truncate">${escapeHtml(act.location)}</span>
                        </button>`
                      : `<span class="text-[11px] text-charcoal-400">未設定地圖地點</span>`
                  }

                  ${
                    actCostNum > 0
                      ? `<div class="text-right shrink-0 bg-cream border border-sand px-2.5 py-1 rounded-xl">
                          <div class="text-xs font-extrabold text-charcoal-900 leading-tight">${actMoney.localText}</div>
                          ${!actMoney.isTWD ? `<div class="text-[10px] font-bold text-terra-600 leading-tight mt-0.5">${actMoney.twdText}</div>` : ''}
                        </div>`
                      : ''
                  }
                </div>
              </div>
            </div>
          `;
        });
        timelineHtml += `</div>`;
      }

      return `
        <div class="space-y-4 animate-view">
          <!-- 天數橫向滾動選擇器 -->
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 -mx-4 px-4 md:mx-0 md:px-0">
            ${dayTabsHtml}
          </div>

          <!-- 手機版當日小計標題列 (< 768px) -->
          <div class="md:hidden flex items-center justify-between bg-paper px-4 py-2.5 rounded-2xl border border-sand shadow-2xs gap-2">
            <div class="text-xs font-extrabold text-charcoal-900 shrink-0">
              Day ${selectedDay} · ${currentDayInfo.fullDate} (${currentDayInfo.weekday})
            </div>
            <div class="text-right">
              <div class="text-xs font-extrabold text-charcoal-900">
                <span class="text-[11px] font-normal text-charcoal-400">當日：</span>${dayMoney.localText}
              </div>
              ${!dayMoney.isTWD ? `<div class="text-[11px] font-bold text-terra-600">${dayMoney.twdText}</div>` : ''}
            </div>
          </div>

          <!-- 電腦雙欄 / 手機單欄主體 -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <div class="lg:col-span-8">
              ${timelineHtml}
            </div>

            <!-- 電腦版右側固定當日統計面板 -->
            <div class="hidden lg:block lg:col-span-4 sticky top-24 space-y-4">
              <div class="bg-paper rounded-3xl p-5 shadow-soft border border-sand space-y-4">
                <div class="flex items-center justify-between border-b border-sand pb-3">
                  <div>
                    <span class="text-[11px] font-bold uppercase tracking-wider ${theme.text}">Day ${selectedDay} 行程摘要</span>
                    <h4 class="font-extrabold text-base text-charcoal-900 mt-0.5">${currentDayInfo.fullDate} (${currentDayInfo.weekday})</h4>
                  </div>
                  <span class="text-xs font-bold px-2.5 py-1 rounded-full ${theme.light} ${theme.text}">${dayActivities.length} 個地點</span>
                </div>

                <div class="bg-cream rounded-2xl p-3.5 border border-sand">
                  <span class="text-[11px] font-semibold text-charcoal-500 block mb-1">當日預估總花費</span>
                  <div class="text-xl font-extrabold text-charcoal-900">${dayMoney.localText}</div>
                  ${!dayMoney.isTWD ? `<div class="text-xs font-bold text-terra-600 mt-0.5">${dayMoney.twdText}</div>` : ''}
                </div>

                ${
                  catBreakdownHtml
                    ? `<div class="space-y-1">
                        <p class="text-[11px] font-bold text-charcoal-400 uppercase tracking-wider mb-1">分類花費明細</p>
                        ${catBreakdownHtml}
                      </div>`
                    : ''
                }

                <button type="button" onclick="openActivityModal()" class="w-full py-3 rounded-2xl ${theme.bg} text-white font-bold text-xs shadow-xs hover:opacity-95 flex items-center justify-center gap-1.5 transition">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  新增 Day ${selectedDay} 行程
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function selectDay(dayNum) {
      selectedDay = dayNum;
      renderApp();
    }

    function addExtraDay() {
      const trip = getCurrentTrip();
      if (trip.days >= 60) {
        showToast('最多支援 60 天行程');
        return;
      }
      trip.days += 1;
      selectedDay = trip.days;
      saveState();
      renderApp();
      showToast(`已新增 Day ${trip.days}`);
    }

    // ------------------------------------------
    // 分頁 3：隨手筆記 (Travel Notes)
    // ------------------------------------------
    function renderNotesView(trip, theme) {
      const filters = [
        { key: 'all', label: '全部' },
        { key: 'food', label: '美食清單' },
        { key: 'shopping', label: '必買購物' },
        { key: 'booking', label: '住宿/票券' },
        { key: 'diary', label: '旅遊日記' }
      ];

      const filterChipsHtml = filters.map(f => {
        const active = noteFilter === f.key;
        return `
          <button type="button" onclick="setNoteFilter('${f.key}')" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition ${
            active
              ? `${theme.bg} text-white shadow-2xs`
              : 'bg-paper text-charcoal-700 border border-sand hover:bg-cream'
          }">
            ${f.label}
          </button>
        `;
      }).join('');

      const q = noteSearchQuery.trim().toLowerCase();
      const filteredNotes = trip.notes.filter(n => {
        const matchCat = noteFilter === 'all' || n.category === noteFilter;
        const matchQuery = !q || n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q);
        return matchCat && matchQuery;
      });

      let notesListHtml = '';
      if (filteredNotes.length === 0) {
        notesListHtml = `
          <div class="bg-paper rounded-3xl p-8 text-center border border-dashed border-sand my-4">
            <div class="w-12 h-12 rounded-2xl bg-terra-50 text-terra-500 flex items-center justify-center mx-auto mb-3">
              <i data-lucide="notebook-pen" class="w-6 h-6"></i>
            </div>
            <h4 class="font-bold text-charcoal-900 text-sm mb-1">找不到相關筆記</h4>
            <p class="text-xs text-charcoal-500">試試切換其他分類，或點擊新增按鈕寫下新的旅遊靈感！</p>
          </div>
        `;
      } else {
        notesListHtml = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5 md:gap-4">`;
        filteredNotes.forEach(note => {
          const cat = NOTE_CATEGORIES[note.category] || NOTE_CATEGORIES.diary;
          const imgHtml = note.image
            ? `<div onclick="openImageLightbox('${note.id}')" class="relative mb-2.5 rounded-xl overflow-hidden border border-sand bg-cream cursor-zoom-in group/img">
                <img src="${note.image}" alt="${escapeHtml(note.title)}" loading="lazy" class="w-full h-40 object-cover group-hover/img:scale-[1.02] transition-transform duration-300" />
                <span class="absolute bottom-2 right-2 bg-charcoal-900/75 text-white text-[10px] font-semibold px-2 py-0.5 rounded-full backdrop-blur-xs flex items-center gap-1">
                  <i data-lucide="maximize-2" class="w-2.5 h-2.5"></i>
                  點擊放大
                </span>
              </div>`
            : '';

          notesListHtml += `
            <div class="bg-paper rounded-2xl p-4 shadow-soft border border-sand hover:border-terra-200 transition journal-dots flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full ${cat.badge}">
                    <i data-lucide="${cat.icon}" class="w-3 h-3"></i>
                    ${cat.label}
                  </span>
                  <div class="flex items-center gap-0.5">
                    <span class="text-[11px] text-charcoal-400 mr-1">${escapeHtml(note.updatedAt || '')}</span>
                    <button type="button" onclick="copyNoteContent('${note.id}')" class="p-1.5 text-charcoal-400 hover:text-sage-600 rounded-lg hover:bg-sage-50 transition" title="複製內容">
                      <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                    </button>
                    <button type="button" onclick="openNoteModal('${note.id}')" class="p-1.5 text-charcoal-400 hover:text-terra-600 rounded-lg hover:bg-terra-50 transition" title="編輯">
                      <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                    </button>
                    <button type="button" onclick="confirmDeleteNote('${note.id}')" class="p-1.5 text-charcoal-400 hover:text-rose-500 rounded-lg hover:bg-rose-50 transition" title="刪除">
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>
                <h4 class="font-bold text-base text-charcoal-900 mb-1.5">${escapeHtml(note.title)}</h4>
                ${imgHtml}
              </div>
              <p class="text-xs text-charcoal-700 whitespace-pre-line leading-relaxed bg-paper/90 p-2.5 rounded-xl border border-sand/80">${escapeHtml(note.content)}</p>
            </div>
          `;
        });
        notesListHtml += `</div>`;
      }

      return `
        <div class="space-y-4 animate-view">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="relative md:w-80 shrink-0">
              <i data-lucide="search" class="w-4 h-4 text-charcoal-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input
                id="note-search-input"
                type="text"
                value="${escapeHtml(noteSearchQuery)}"
                oninput="handleNoteSearch(this.value)"
                placeholder="搜尋美食名單、訂房代號或伴手禮..."
                class="w-full bg-paper border border-sand rounded-2xl pl-10 pr-9 py-2.5 text-sm text-charcoal-900 placeholder:text-charcoal-400 focus:outline-none focus:border-terra-500 shadow-2xs"
              />
              ${
                noteSearchQuery
                  ? `<button type="button" onclick="handleNoteSearch('')" class="absolute right-3 top-1/2 -translate-y-1/2 text-charcoal-400 hover:text-charcoal-700">
                      <i data-lucide="x-circle" class="w-4 h-4"></i>
                    </button>`
                  : ''
              }
            </div>

            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 -mx-4 px-4 md:mx-0 md:px-0 md:pb-0">
              ${filterChipsHtml}
            </div>
          </div>

          ${notesListHtml}
        </div>
      `;
    }

    function setNoteFilter(key) {
      noteFilter = key;
      renderApp();
    }

    function handleNoteSearch(val) {
      noteSearchQuery = val;
      renderApp();
      const input = document.getElementById('note-search-input');
      if (input) {
        input.focus();
        input.setSelectionRange(val.length, val.length);
      }
    }

    function copyNoteContent(noteId) {
      const trip = getCurrentTrip();
      const note = trip.notes.find(n => n.id === noteId);
      if (!note) return;
      copyTextToClipboard(`${note.title}\n${note.content}`, '已複製筆記內容');
    }

    // ------------------------------------------
    // 分頁 4：行李清單 (Packing Checklist)
    // ------------------------------------------
    function renderChecklistView(trip, theme) {
      const checkedCount = trip.checklist.filter(c => c.checked).length;
      const totalCount = trip.checklist.length;
      const percent = totalCount > 0 ? Math.round((checkedCount / totalCount) * 100) : 0;

      let categoriesHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 md:gap-4 items-start">`;
      Object.entries(CHECKLIST_CATEGORIES).forEach(([catKey, catInfo]) => {
        const items = trip.checklist.filter(c => c.category === catKey);
        const catChecked = items.filter(c => c.checked).length;
        const isCollapsed = Boolean(collapsedChecklistCats[catKey]);

        const itemsHtml = items.length === 0
          ? `<p class="text-xs text-charcoal-400 py-2 text-center">此分類尚無項目</p>`
          : items.map(item => `
              <div class="flex items-center justify-between gap-2 py-2 border-b border-sand/60 last:border-none">
                <label class="flex items-center gap-3 flex-1 cursor-pointer select-none min-w-0">
                  <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleChecklistItem('${item.id}')" class="w-4 h-4 rounded accent-sage-500 cursor-pointer shrink-0" />
                  <span class="text-sm ${item.checked ? 'line-through text-charcoal-400' : 'text-charcoal-900 font-medium'} truncate transition">${escapeHtml(item.text)}</span>
                </label>
                <button type="button" onclick="deleteChecklistItem('${item.id}')" class="p-1 text-charcoal-400 hover:text-rose-500 rounded-lg transition shrink-0" title="移除項目">
                  <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            `).join('');

        categoriesHtml += `
          <div class="bg-paper rounded-2xl p-4 shadow-soft border border-sand">

    // 彈窗 B：新增 / 編輯 隨手筆記 (支援 Canvas 圖片自動壓縮上傳)
    // ------------------------------------------
    function formatBytesReadable(bytes) {
      if (!bytes || bytes <= 0) return '0 KB';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function estimateBase64Bytes(dataUrl) {
      if (!dataUrl || typeof dataUrl !== 'string') return 0;
      const idx = dataUrl.indexOf(',');
      const b64 = idx !== -1 ? dataUrl.slice(idx + 1) : dataUrl;
      return Math.round((b64.length * 3) / 4);
    }

    function compressImageFile(file, maxEdge = 1024, quality = 0.7) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          reject(new Error('請選擇有效的圖片檔案'));
          return;
        }
        const originalBytes = file.size || 0;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxEdge || h > maxEdge) {
              if (w >= h) {
                h = Math.round((h * maxEdge) / w);
                w = maxEdge;
              } else {
                w = Math.round((w * maxEdge) / h);
                h = maxEdge;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);

            const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
            const compressedBytes = estimateBase64Bytes(compressedDataUrl);
            const savedPercent = originalBytes > 0
              ? Math.max(0, Math.round(((originalBytes - compressedBytes) / originalBytes) * 100))
              : 0;

            resolve({
              dataUrl: compressedDataUrl,
              originalBytes,
              compressedBytes,
              savedPercent,
              width: w,
              height: h
            });
          };
          img.onerror = () => reject(new Error('圖片載入失敗'));
          img.src = evt.target.result;
        };
        reader.onerror = () => reject(new Error('檔案讀取失敗'));
        reader.readAsDataURL(file);
      });
    }

    function renderNoteImagePreviewArea() {
      const area = document.getElementById('note-image-preview-area');
      if (!area) return;

      if (!pendingNoteImageBase64) {
        area.innerHTML = `
          <label class="flex flex-col items-center justify-center py-3 cursor-pointer text-center gap-1.5">

            <input type="file" accept="image/*" onchange="handleNoteImageSelect(event)" class="hidden" />

        let statsBadge = '';

          statsBadge = `
            <div class="text-[11px] font-bold text-sage-700 bg-sage-50 border border-sage-200 px-2.5 py-1 rounded-lg flex items-center justify-between gap-2">
              <span>${formatBytesReadable(pendingNoteImageStats.originalBytes)} → ${formatBytesReadable(pendingNoteImageStats.compressedBytes)}</span>
              <span class="text-terra-600">省下 ${pendingNoteImageStats.savedPercent}% 空間</span>
            </div>
          `;
        } else if (pendingNoteImageStats?.existingBytes) {
          statsBadge = `
            <div class="text-[11px] font-semibold text-charcoal-600 bg-paper border border-sand px-2.5 py-1 rounded-lg">
              已附加圖片（佔用約 ${formatBytesReadable(pendingNoteImageStats.existingBytes)}）
            </div>
          `;
        }

        area.innerHTML = `
          <div class="space-y-2">
            <div class="relative rounded-xl overflow-hidden border border-sand bg-paper">
              <img src="${pendingNoteImageBase64}" alt="筆記附圖預覽" class="w-full max-h-48 object-contain mx-auto bg-charcoal-900/5" />
              <div class="absolute top-2 right-2 flex items-center gap-1.5">
                <label class="px-2.5 py-1 rounded-lg bg-paper/95 text-charcoal-800 border border-sand text-[11px] font-bold shadow-xs cursor-pointer hover:bg-cream transition">

                  移除
                </button>
              </div>
            </div>
            ${statsBadge}
          </div>
        `;
      }

      if (window.lucide) lucide.createIcons();
    }

    async function processSelectedNoteImageFile(file) {
      if (!file) return;
      const area = document.getElementById('note-image-preview-area');
      if (area) {
        area.innerHTML = `
          <div class="py-5 text-center text-xs font-bold text-terra-600 flex items-center justify-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-terra-500 animate-ping"></span>
            <span>正在最佳化壓縮圖片中...</span>
          </div>
        `;
      }
      try {
        const res = await compressImageFile(file, 1024, 0.7);
        pendingNoteImageBase64 = res.dataUrl;
        pendingNoteImageStats = res;
        renderNoteImagePreviewArea();
        showToast(`圖片已壓縮（省下 ${res.savedPercent}% 空間）`);
      } catch (err) {
        showToast(err.message || '圖片處理失敗');
        renderNoteImagePreviewArea();
      }
    }

    function handleNoteImageSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (file) processSelectedNoteImageFile(file);
    }

    function handleNoteImageDrop(e) {
      e.preventDefault();
      const dz = document.getElementById('note-image-dropzone');
      if (dz) dz.classList.remove('border-terra-500', 'bg-terra-50/40');
      const file = e.dataTransfer?.files?.[0];
      if (file) processSelectedNoteImageFile(file);
    }

    function handleNoteFormPaste(e) {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) {
            e.preventDefault();
            processSelectedNoteImageFile(file);
            break;
          }
        }
      }
    }

    function saveNoteForm(e, noteId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const trip = getCurrentTrip();
      const todayStr = formatDateISO(new Date());

      const payload = {
        id: noteId || generateId('note'),
        category: fd.get('category'),
        title: fd.get('title').trim(),
        content: fd.get('content').trim(),
        image: pendingNoteImageBase64 || '',
        updatedAt: todayStr
      };

      if (noteId) {
        const idx = trip.notes.findIndex(n => n.id === noteId);
        if (idx !== -1) trip.notes[idx] = payload;
      } else {
        trip.notes.unshift(payload);
      }

      pendingNoteImageBase64 = '';
      pendingNoteImageStats = null;
      saveState();
      closeModal();
      renderApp();
      showToast(noteId ? '筆記已更新' : '已儲存新筆記');

    function confirmDeleteTrip(tripId) {

      openConfirmModal('刪除整趟旅程', '確定要刪除這趟旅程的所有行程與筆記嗎？此動作無法復原。', '確認刪除', () => {

    function syncTripDates(changedField) {
      const startEl = document.getElementById('trip-start-date');
      const endEl = document.getElementById('trip-end-date');
      const daysEl = document.getElementById('trip-days-input');
      if (!startEl || !endEl || !daysEl) return;

      if (changedField === 'start' || changedField === 'days') {
        const d = Math.max(1, Math.min(60, Number(daysEl.value) || 1));
        daysEl.value = d;
        endEl.value = getEndDateISO(startEl.value, d);
      } else if (changedField === 'end') {
        if (endEl.value < startEl.value) {
          endEl.value = startEl.value;
        }
        daysEl.value = calcDaysBetween(startEl.value, endEl.value);
      }
    }

    function applyCurrencyPreset(code, symbol, rate) {
      const codeInput = document.getElementById('trip-currency-code');
      const symInput = document.getElementById('trip-currency-symbol');
      const rateInput = document.getElementById('trip-exchange-rate');
      if (codeInput) codeInput.value = code;
      if (symInput) symInput.value = symbol;
      if (rateInput) rateInput.value = rate;
      updateTripRatePreview();
    }

    function updateTripRatePreview() {
      const box = document.getElementById('trip-rate-preview-box');
      if (!box) return;
      const code = (document.getElementById('trip-currency-code')?.value || 'TWD').toUpperCase().trim() || 'TWD';
      const symbol = document.getElementById('trip-currency-symbol')?.value || code;
      const rate = Number(document.getElementById('trip-exchange-rate')?.value) || 0;

      if (code === 'TWD' || rate <= 0) {
        box.innerHTML = `<span class="font-semibold text-sage-700">使用新台幣 (TWD) 計價，無需額外換算匯率</span>`;
        return;
      }

      const sampleLocal = rate < 0.1 ? 10000 : (rate < 2 ? 1000 : 100);
      const sampleTwd = Math.round(sampleLocal * rate);
      const for100Twd = Math.round(100 / rate);

      box.innerHTML = `
        <span><strong class="text-charcoal-900">${symbol}${sampleLocal.toLocaleString()} ${code}</strong> ≈ <strong class="text-terra-600">NT$ ${sampleTwd.toLocaleString()}</strong></span>
        <span class="text-charcoal-500">NT$100 ≈ ${symbol}${for100Twd.toLocaleString()}</span>
      `;
    }

    function saveTripForm(e, tripId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const daysVal = Math.max(1, Math.min(60, Number(fd.get('days')) || 3));
      const rawCode = (fd.get('currency') || 'TWD').toUpperCase().trim() || 'TWD';
      const rawSymbol = (fd.get('currencySymbol') || (rawCode === 'TWD' ? 'NT$' : rawCode)).trim();
      const rawRate = rawCode === 'TWD' ? 1 : (Number(fd.get('exchangeRate')) > 0 ? Number(fd.get('exchangeRate')) : 1);

      if (tripId) {
        const trip = appState.trips.find(t => t.id === tripId);
        if (trip) {
          trip.title = fd.get('title').trim();
          trip.destination = fd.get('destination').trim();
          trip.startDate = fd.get('startDate');
          trip.days = daysVal;
          trip.currency = rawCode;
          trip.currencySymbol = rawSymbol;
          trip.exchangeRate = rawRate;
          trip.theme = fd.get('theme') || 'terra';
          trip.coverNote = fd.get('coverNote').trim();
          trip.updatedAt = Date.now();
        }
      } else {
        const newTrip = {
          id: generateId('trip'),
          title: fd.get('title').trim(),
          destination: fd.get('destination').trim(),
          startDate: fd.get('startDate'),
          days: daysVal,
          currency: rawCode,
          currencySymbol: rawSymbol,
          exchangeRate: rawRate,
          theme: fd.get('theme') || 'terra',
          coverNote: fd.get('coverNote').trim(),
          updatedAt: Date.now(),
          itinerary: [],
          notes: [],
          checklist: [
            { id: generateId('chk'), category: 'docs', text: '護照正本', checked: false },
            { id: generateId('chk'), category: 'docs', text: '當地貨幣現金 & 信用卡', checked: false },
            { id: generateId('chk'), category: 'electronics', text: '手機充電器 & 行動電源', checked: false },
            { id: generateId('chk'), category: 'clothes', text: '換洗衣物與舒適鞋款', checked: false }
          ]
        };
        appState.trips.unshift(newTrip);
        appState.currentTripId = newTrip.id;
        selectedDay = 1;
      }

      saveState();
      closeModal();
      renderApp();
      showToast(tripId ? '旅程與匯率設定已更新' : '新旅程已建立！');
    }

            </button>
            <button type="button" onclick="copyCalcResult()" class="py-2.5 rounded-xl bg-paper border border-sand text-charcoal-700 text-xs font-bold hover:bg-cream transition">
              複製結果
            </button>
            <button type="button" onclick="openTripFormModal('${trip.id}')" class="py-2.5 rounded-xl bg-sage-500 text-white text-xs font-bold hover:bg-sage-600 transition">

    function handleCalcInput(source) {
      const trip = getCurrentTrip();
      const { rate } = getTripCurrencyInfo(trip);
      const foreignEl = document.getElementById('calc-foreign-input');
      const twdEl = document.getElementById('calc-twd-input');
      if (!foreignEl || !twdEl || rate <= 0) return;

      if (source === 'foreign') {
        const fVal = Number(foreignEl.value);
        twdEl.value = foreignEl.value === '' ? '' : Math.round(fVal * rate);
      } else {
        const tVal = Number(twdEl.value);
        foreignEl.value = twdEl.value === '' ? '' : Math.round((tVal / rate) * 100) / 100;
      }
    }

    function clearCalcInputs() {
      const foreignEl = document.getElementById('calc-foreign-input');
      const twdEl = document.getElementById('calc-twd-input');
      if (foreignEl) {
        foreignEl.value = '';
        foreignEl.focus();
      }
      if (twdEl) twdEl.value = '';
    }

    function copyCalcResult() {
      const trip = getCurrentTrip();
      const currInfo = getTripCurrencyInfo(trip);
      const fVal = Number(document.getElementById('calc-foreign-input')?.value) || 0;
      const tVal = Number(document.getElementById('calc-twd-input')?.value) || 0;
      copyTextToClipboard(`${currInfo.symbol}${fVal.toLocaleString()} ${currInfo.code} ≈ NT$ ${tVal.toLocaleString()}`, '已複製換算結果');
    }

    // ------------------------------------------
    // 彈窗 G：雙機同步（文字同步碼 + PeerJS 連線）與本機儲存空間監控
    // ------------------------------------------
    async function computeStorageMetrics() {
      const jsonStr = JSON.stringify(appState);
      const totalDataBytes = new Blob([jsonStr]).size;
      let totalImagesCount = 0;
      let totalImagesBytes = 0;

      appState.trips.forEach(t => {
        (t.notes || []).forEach(n => {
          if (n.image && typeof n.image === 'string') {
            totalImagesCount += 1;
            totalImagesBytes += new Blob([n.image]).size;
          }
        });
      });

      let quotaBytes = storageEngineMode === 'indexeddb' ? 500 * 1024 * 1024 : 5 * 1024 * 1024;
      if (navigator.storage && typeof navigator.storage.estimate === 'function') {
        try {
          const est = await navigator.storage.estimate();
          if (est.quota && est.quota > 0) quotaBytes = est.quota;
        } catch (e) {}
      }

      const rawPercent = quotaBytes > 0 ? (totalDataBytes / quotaBytes) * 100 : 0;
      const barPercent = Math.min(100, Math.max(totalDataBytes > 0 ? 2 : 0, rawPercent));

      return {
        totalDataBytes,
        totalImagesCount,
        totalImagesBytes,
        quotaBytes,
        rawPercent,
        barPercent
      };
    }

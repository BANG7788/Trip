  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%235B7B6A'/%3E%3Crect x='96' y='72' width='320' height='368' rx='36' fill='%23FAF8F5'/%3E%3Crect x='136' y='72' width='24' height='368' fill='%23E67E45'/%3E%3Ccircle cx='286' cy='210' r='58' fill='%23E67E45'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Inter"', '"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            cream: '#FAF8F5',
            paper: '#FFFFFF',
            sage: {
              50: '#F2F6F4',
              100: '#E1EBE5',
              200: '#C3D7CC',
              500: '#5B7B6A',
              600: '#496556',
              700: '#3A5044',
            },
            terracotta: {
              50: '#FDF5F0',
              100: '#FAE6D9',
              500: '#E67E45',
              600: '#D06932',
            },
            ink: {
              900: '#2C3330',
              600: '#5C6661',
              400: '#8F9994',
            }
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(44, 51, 48, 0.06)',
            'float': '0 8px 25px -4px rgba(91, 123, 106, 0.25)',
            'nav': '0 -4px 20px rgba(44, 51, 48, 0.05)',
            'desktop': '0 10px 40px -10px rgba(44, 51, 48, 0.07)',
          }
        }
      }
    }

  <style>
    /* 基礎手機原生體驗與安全區域適配 */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      background-color: #FAF8F5;
      color: #2C3330;
      font-family: 'Plus Jakarta Sans', 'Inter', 'Noto Sans TC', sans-serif;
      overscroll-behavior-y: none;
      padding-top: var(--sat);
    }

    /* 隱藏橫向捲軸但保留滑動功能 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 底部安全區域適配（手機模式專用，電腦模式自動還原正常底部留白） */
    .pb-safe {
      padding-bottom: calc(5.5rem + var(--sab));
    }
    @media (min-width: 768px) {
      .pb-safe {
        padding-bottom: 2.5rem;
      }
    }
    .nav-safe {
      padding-bottom: max(0.5rem, var(--sab));
    }

    /* 頁面切換微動畫 */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-view {
      animation: fadeSlideUp 0.25s ease-out forwards;
    }

    /* 彈窗背景與卡片動畫（手機 Bottom Sheet / 電腦 Centered Modal 自動切換） */
    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes sheetSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes dialogZoomIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .modal-backdrop {
      animation: modalFadeIn 0.2s ease-out forwards;
    }
    .responsive-dialog {
      animation: sheetSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @media (min-width: 768px) {
      .responsive-dialog {
        animation: dialogZoomIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    }

    /* 手帳點陣底紋 (僅裝飾卡片使用) */
    .journal-dots {
      background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
      background-size: 16px 16px;
    }
  </style>
</head>
<body class="min-h-screen bg-cream selection:bg-sage-200">

  <!-- 雙模式自動切換容器：手機版 (<768px) 單欄 App，電腦版 (>=768px) 左側側邊欄 + 右側寬敞工作區 -->
  <div id="app" class="w-full max-w-[1380px] mx-auto min-h-screen bg-cream relative flex flex-col md:flex-row">

    <!-- ==========================================
         電腦模式專屬：左側固定側邊導覽欄 (Desktop Sidebar, md:flex)
         ========================================== -->

      <div class="space-y-5">
        <!-- 品牌識別區 -->
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-sage-500 text-white flex items-center justify-center shadow-sm">
              <i data-lucide="book-open-check" class="w-5 h-5"></i>
            </div>
            <div>
              <span class="font-bold text-base text-ink-900 tracking-tight block leading-none">旅途手帳</span>
              <span class="text-[10px] font-semibold tracking-widest uppercase text-ink-400 mt-1 block">TabiNote Desktop</span>
            </div>
          </div>
          <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-sage-50 text-sage-600 border border-sage-200/70">電腦版</span>

        <!-- 目前旅程切換卡片 -->

            </div>

            <span class="text-ink-600 font-medium flex items-center gap-1">
              <i data-lucide="coins" class="w-3.5 h-3.5 text-terracotta-500"></i>
              <span id="sidebar-rate-text">1 JPY = 0.215 TWD</span>
            </span>
            <span class="text-sage-600 font-bold">設定</span>

          <div class="grid grid-cols-2 gap-2 pt-0.5">
            <button type="button" onclick="openTripSelector()" class="py-1.5 px-2.5 rounded-xl bg-white border border-stone-200 text-xs font-semibold text-ink-700 hover:bg-stone-50 flex items-center justify-center gap-1 transition">
              <i data-lucide="layers" class="w-3.5 h-3.5 text-sage-600"></i>
              切換旅程
            </button>
            <button type="button" onclick="openTripFormModal()" class="py-1.5 px-2.5 rounded-xl bg-sage-50 border border-sage-200 text-xs font-semibold text-sage-700 hover:bg-sage-100 flex items-center justify-center gap-1 transition">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              新增旅程

          </div>
        </div>

        <!-- 四大主分頁直向導覽選單 -->
        <nav class="space-y-1">
          <p class="px-2.5 text-[11px] font-bold text-ink-400 uppercase tracking-wider mb-1.5">行程規劃與手帳</p>
          <button type="button" onclick="switchTab('overview')" data-tab="overview" class="sidebar-nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium text-ink-600 hover:bg-stone-100/80 transition">
            <span class="flex items-center gap-3">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
              <span>行程總覽</span>
            </span>
          </button>
          <button type="button" onclick="switchTab('itinerary')" data-tab="itinerary" class="sidebar-nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium text-ink-600 hover:bg-stone-100/80 transition">
            <span class="flex items-center gap-3">

            <span id="sidebar-badge-itinerary" class="text-[11px] px-2 py-0.5 rounded-full bg-stone-100 text-ink-600 font-semibold">0</span>
          </button>
          <button type="button" onclick="switchTab('notes')" data-tab="notes" class="sidebar-nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium text-ink-600 hover:bg-stone-100/80 transition">
            <span class="flex items-center gap-3">
              <i data-lucide="notebook-pen" class="w-4 h-4"></i>
              <span>隨手筆記</span>
            </span>
            <span id="sidebar-badge-notes" class="text-[11px] px-2 py-0.5 rounded-full bg-stone-100 text-ink-600 font-semibold">0</span>
          </button>
          <button type="button" onclick="switchTab('checklist')" data-tab="checklist" class="sidebar-nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium text-ink-600 hover:bg-stone-100/80 transition">
            <span class="flex items-center gap-3">
              <i data-lucide="check-square" class="w-4 h-4"></i>
              <span>行李清單</span>
            </span>
            <span id="sidebar-badge-checklist" class="text-[11px] px-2 py-0.5 rounded-full bg-stone-100 text-ink-600 font-semibold">0%</span>
          </button>
        </nav>
      </div>

      <!-- 側邊欄底部快捷工具區 -->
      <div class="pt-4 border-t border-stone-200/70 space-y-1.5">
        <p class="px-2.5 text-[11px] font-bold text-ink-400 uppercase tracking-wider mb-1">實用工具</p>
        <button type="button" onclick="openCurrencyCalculator()" class="w-full flex items-center gap-3 px-3.5 py-2 rounded-xl text-xs font-semibold text-ink-700 hover:bg-sage-50 hover:text-sage-700 transition">
          <i data-lucide="calculator" class="w-4 h-4 text-sage-600"></i>
          <span>隨手匯率速算機</span>

        <button type="button" onclick="openBackupModal()" class="w-full flex items-center gap-3 px-3.5 py-2 rounded-xl text-xs font-semibold text-ink-700 hover:bg-stone-100 transition">
          <i data-lucide="folder-sync" class="w-4 h-4 text-sky-600"></i>
          <span>資料備份與還原 (JSON)</span>
        </button>
        <button type="button" onclick="openInstallModal()" class="w-full flex items-center gap-3 px-3.5 py-2 rounded-xl text-xs font-semibold text-terracotta-600 hover:bg-terracotta-50 transition">
          <i data-lucide="smartphone" class="w-4 h-4"></i>
          <span>加入手機主畫面 (PWA)</span>
        </button>
      </div>
    </aside>

    <!-- ==========================================
         右側主工作區容器（手機版滿版單欄 / 電腦版自適應寬欄）
         ========================================== -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen">

      <!-- 手機模式頂部導覽列 (Mobile Header, md:hidden) -->
      <header class="md:hidden sticky top-0 z-30 bg-cream/90 backdrop-blur-md border-b border-stone-200/60 px-4 py-3 flex items-center justify-between gap-2">
        <!-- 旅程切換器按鈕 -->
        <button type="button" onclick="openTripSelector()" class="flex items-center gap-2.5 text-left min-w-0 flex-1 py-1 px-2 -ml-2 rounded-xl hover:bg-stone-200/50 active:scale-[0.99] transition">
          <div id="header-trip-badge" class="w-9 h-9 rounded-xl bg-sage-500 text-white flex items-center justify-center shrink-0 shadow-sm">
            <i data-lucide="compass" class="w-5 h-5"></i>
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1">
              <h1 id="header-trip-title" class="font-bold text-base text-ink-900 truncate">載入中...</h1>
              <i data-lucide="chevron-down" class="w-4 h-4 text-ink-400 shrink-0"></i>
            </div>
            <p id="header-trip-subtitle" class="text-[11px] text-ink-600 truncate">準備出發</p>
          </div>
        </button>

        <!-- 右上角功能鍵：匯率速算、加入主畫面教學 & 資料備份 -->
        <div class="flex items-center gap-1.5 shrink-0">
          <button type="button" onclick="openCurrencyCalculator()" title="匯率速算機" class="flex items-center gap-1 bg-sage-50 text-sage-700 border border-sage-200 px-2.5 py-1.5 rounded-full text-xs font-semibold hover:bg-sage-100 active:scale-95 transition">
            <i data-lucide="calculator" class="w-3.5 h-3.5"></i>
            <span>速算</span>
          </button>
          <button type="button" id="header-install-btn" onclick="openInstallModal()" title="安裝到手機主畫面" class="flex items-center gap-1 bg-terracotta-50 text-terracotta-600 border border-terracotta-100 px-2.5 py-1.5 rounded-full text-xs font-semibold hover:bg-terracotta-100 active:scale-95 transition">
            <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
            <span class="hidden min-[360px]:inline">加主畫面</span>
          </button>
          <button type="button" onclick="openBackupModal()" title="備份與還原資料" class="p-1.5 rounded-full text-ink-600 hover:bg-stone-200/60 active:scale-95 transition">
            <i data-lucide="folder-sync" class="w-5 h-5"></i>
          </button>
        </div>
      </header>

      <!-- 電腦模式頂部工作列 (Desktop Top Toolbar, hidden md:flex) -->
      <header class="hidden md:flex sticky top-0 z-20 bg-cream/90 backdrop-blur-md border-b border-stone-200/60 px-8 py-4 items-center justify-between gap-4">
        <div class="min-w-0">
          <div class="flex items-center gap-2.5">
            <h1 id="desktop-page-title" class="font-bold text-xl text-ink-900 tracking-tight">行程總覽</h1>
            <span id="desktop-trip-pill" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-white border border-stone-200 text-ink-600 truncate">東京五天四夜自由行</span>
          </div>
          <p id="desktop-page-desc" class="text-xs text-ink-400 mt-0.5">檢視旅程倒數、預算與每日行程總覽</p>
        </div>

        <div class="flex items-center gap-2.5 shrink-0">
          <button type="button" onclick="openCurrencyCalculator()" class="flex items-center gap-1.5 bg-white text-ink-700 border border-stone-200 px-3.5 py-2 rounded-xl text-xs font-semibold hover:bg-stone-50 shadow-xs transition">
            <i data-lucide="calculator" class="w-4 h-4 text-sage-600"></i>
            <span>匯率速算</span>
          </button>
          <button type="button" id="desktop-primary-action-btn" onclick="handleDesktopPrimaryAction()" class="flex items-center gap-1.5 bg-sage-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm hover:bg-sage-600 active:scale-[0.99] transition">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span id="desktop-primary-action-label">編輯旅程設定</span>
          </button>
        </div>
      </header>

      <!-- 主內容區 (根據分頁動態渲染，電腦版自動展開寬度與舒適內距) -->
      <main id="main-content" class="flex-1 w-full max-w-md md:max-w-5xl mx-auto px-4 md:px-8 pt-4 md:pt-6 pb-safe overflow-x-hidden">
        <!-- 由 JavaScript 動態填入 -->
      </main>

    <!-- 手機模式專屬：懸浮新增按鈕 (FAB, md:hidden) -->
    <button type="button" id="fab-btn" onclick="handleFabClick()" class="md:hidden fixed bottom-20 right-4 z-30 w-14 h-14 rounded-full bg-sage-500 text-white shadow-float flex items-center justify-center hover:bg-sage-600 active:scale-90 transition-all" style="margin-bottom: var(--sab);">
      <i data-lucide="plus" class="w-7 h-7"></i>
    </button>

    <!-- 手機模式專屬：底部導覽列 (Bottom Navigation Bar, md:hidden) -->
    <nav class="md:hidden fixed bottom-0 inset-x-0 w-full z-30 bg-white/95 backdrop-blur-md border-t border-stone-200/80 shadow-nav nav-safe">
      <div class="grid grid-cols-4 h-14 max-w-md mx-auto">
        <button type="button" onclick="switchTab('overview')" data-tab="overview" class="nav-item flex flex-col items-center justify-center gap-0.5 text-sage-500 font-medium transition">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span class="text-[11px]">行程總覽</span>
        </button>
        <button type="button" onclick="switchTab('itinerary')" data-tab="itinerary" class="nav-item flex flex-col items-center justify-center gap-0.5 text-ink-400 font-medium transition">
          <i data-lucide="calendar-days" class="w-5 h-5"></i>
          <span class="text-[11px]">每日行程</span>
        </button>
        <button type="button" onclick="switchTab('notes')" data-tab="notes" class="nav-item flex flex-col items-center justify-center gap-0.5 text-ink-400 font-medium transition">
          <i data-lucide="notebook-pen" class="w-5 h-5"></i>
          <span class="text-[11px]">隨手筆記</span>
        </button>
        <button type="button" onclick="switchTab('checklist')" data-tab="checklist" class="nav-item flex flex-col items-center justify-center gap-0.5 text-ink-400 font-medium transition">

    <!-- 通用彈窗容器 (手機版 Bottom Sheet / 電腦版 Centered Modal 自動適配) -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden flex items-end md:items-center justify-center md:p-6">
      <!-- 背景遮罩 -->
      <div onclick="closeModal()" class="modal-backdrop absolute inset-0 bg-ink-900/40 backdrop-blur-[2px]"></div>
      <!-- 彈窗內容盒 -->
      <div id="modal-body" class="responsive-dialog relative z-10 w-full max-w-md md:max-w-xl bg-white rounded-t-3xl md:rounded-3xl shadow-2xl max-h-[88vh] flex flex-col overflow-hidden">
        <!-- 動態內容 -->
      </div>
    </div>

    <!-- 輕量提示吐司 (Toast Notification) -->
    <div id="toast" class="fixed top-16 md:top-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 transform -translate-y-2">
      <div class="bg-ink-900/90 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 backdrop-blur-sm">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-sage-200"></i>
        <span id="toast-message">已儲存</span>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. PWA Manifest 與 beforeinstallprompt 支援
    // ==========================================
    let deferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
    });

    (function setupDynamicManifest() {
      try {

    function normalizeTripData(trip) {
      if (!trip) return trip;
      const code = (trip.currency || 'TWD').toUpperCase();
      const preset = CURRENCY_PRESETS.find(p => p.code === code);
      trip.currency = code;
      trip.currencySymbol = trip.currencySymbol || (preset ? preset.symbol : `${code} `);
      trip.exchangeRate = code === 'TWD' ? 1 : (Number(trip.exchangeRate) > 0 ? Number(trip.exchangeRate) : (preset ? preset.defaultRate : 1));
      trip.days = Math.max(1, Number(trip.days) || 1);
      trip.itinerary = Array.isArray(trip.itinerary) ? trip.itinerary : [];
      trip.notes = Array.isArray(trip.notes) ? trip.notes : [];
      trip.checklist = Array.isArray(trip.checklist) ? trip.checklist : [];
      return trip;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.trips) && parsed.trips.length > 0) {
            parsed.trips = parsed.trips.map(normalizeTripData);
            return parsed;
          }
        }
      } catch (e) {
        console.error('讀取本地資料失敗:', e);
      }
      const def = getDefaultData();
      saveState(def);
      return def;
    }

    function saveState(stateToSave = appState) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
      } catch (e) {
        console.error('儲存資料失敗:', e);
        showToast('儲存空間已滿，建議匯出備份');
      }
    }

    function getCurrentTrip() {
      let trip = appState.trips.find(t => t.id === appState.currentTripId);
      if (!trip && appState.trips.length > 0) {
        trip = appState.trips[0];
        appState.currentTripId = trip.id;
        saveState();
      }
      return normalizeTripData(trip);
    }

    // ==========================================
    // 5. 工具函式 (Helpers)
    // ==========================================
    function generateId(prefix = 'id') {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`;
    }

    function formatDateISO(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      if (!toast || !toastMsg) return;
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
      }, 2200);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function copyTextToClipboard(text, successMsg = '已複製到剪貼簿') {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(successMsg);
      } catch (err) {
        showToast('複製失敗，請手動選取');
      }
      document.body.removeChild(textarea);
    }

    // 計算第 N 天的日期與星期幾
    function getDayDateInfo(startDateStr, dayNum) {
      if (!startDateStr) return { dateText: `第 ${dayNum} 天`, weekday: '', fullDate: '' };
      const parts = startDateStr.split('-');
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      d.setDate(d.getDate() + (dayNum - 1));
      const month = d.getMonth() + 1;
      const date = d.getDate();
      const weekdays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      return {
        dateText: `${month}/${date}`,
        weekday: weekdays[d.getDay()],
        fullDate: `${d.getFullYear()}/${String(month).padStart(2, '0')}/${String(date).padStart(2, '0')}`
      };
    }

    // 根據開始日期與結束日期計算天數
    function calcDaysBetween(startStr, endStr) {
      if (!startStr || !endStr) return 1;
      const s = startStr.split('-').map(Number);
      const e = endStr.split('-').map(Number);
      const d1 = new Date(s[0], s[1] - 1, s[2]);
      const d2 = new Date(e[0], e[1] - 1, e[2]);
      const diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
      return Math.max(1, Math.min(60, diff || 1));
    }

    // 計算結束日期 YYYY-MM-DD
    function getEndDateISO(startStr, days) {
      if (!startStr) return '';
      const parts = startStr.split('-').map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + (Math.max(1, Number(days) || 1) - 1));
      return formatDateISO(d);
    }

    // 計算距離出發還有幾天
    function getCountdownBadge(startDateStr, days) {
      if (!startDateStr) return '規劃中';
      const parts = startDateStr.split('-');
      const start = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const diffDays = Math.round((start - now) / (1000 * 60 * 60 * 24));

      if (diffDays > 0) return `倒數 ${diffDays} 天出發`;
      if (diffDays === 0) return `就是今天出發！🎉`;
      if (diffDays < 0 && Math.abs(diffDays) < days) return `旅程第 ${Math.abs(diffDays) + 1} 天進行中 ✨`;
      return `美好回憶已收藏`;
    }

    // 開啟 Google Maps 搜尋
    function openGoogleMaps(locationQuery) {
      if (!locationQuery) return;
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(locationQuery)}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    // 取得旅程幣別與匯率資訊（向下相容舊資料）
    function getTripCurrencyInfo(trip) {
      const code = (trip?.currency || 'TWD').toUpperCase();
      const preset = CURRENCY_PRESETS.find(p => p.code === code);
      const symbol = trip?.currencySymbol || (preset ? preset.symbol : `${code} `);
      const rate = code === 'TWD' ? 1 : (Number(trip?.exchangeRate) > 0 ? Number(trip.exchangeRate) : (preset ? preset.defaultRate : 1));
      const isTWD = code === 'TWD';
      return { code, symbol, rate, isTWD };
    }

    // 格式化當地金額與台幣換算比對
    function formatMoneyWithTwd(amount, trip) {
      const num = Number(amount) || 0;
      const { code, symbol, rate, isTWD } = getTripCurrencyInfo(trip);
      const localFormatted = `${symbol} ${num.toLocaleString()}`;
      if (isTWD) {
        return {
          localText: `NT$ ${num.toLocaleString()}`,
          twdText: '',
          twdValue: num,
          isTWD: true,
          code,
          symbol,
          rate
        };
      }
      const twdValue = Math.round(num * rate);
      return {
        localText: localFormatted,
        twdText: `≈ NT$ ${twdValue.toLocaleString()}`,
        twdValue,
        isTWD: false,
        code,
        symbol,
        rate
      };
    }

    // 自訂確認對話框（不使用原生 confirm()）
    function openConfirmModal(title, message, confirmLabel, onConfirm) {
      pendingConfirmCallback = onConfirm;
      openModal(`
        <div class="p-5 space-y-4">
          <div class="flex items-center justify-between border-b border-stone-100 pb-3">
            <h3 class="font-bold text-base text-ink-900 flex items-center gap-2">
              <i data-lucide="alert-circle" class="w-5 h-5 text-terracotta-500"></i>
              ${escapeHtml(title)}
            </h3>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-ink-600"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <p class="text-sm text-ink-600 leading-relaxed">${escapeHtml(message)}</p>
          <div class="grid grid-cols-2 gap-2.5 pt-2">
            <button type="button" onclick="closeModal()" class="py-2.5 rounded-xl bg-stone-100 text-ink-700 font-semibold text-sm hover:bg-stone-200 transition">取消</button>
            <button type="button" onclick="executePendingConfirm()" class="py-2.5 rounded-xl bg-rose-500 text-white font-bold text-sm hover:bg-rose-600 transition">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      `);
    }

    function executePendingConfirm() {
      const cb = pendingConfirmCallback;
      pendingConfirmCallback = null;
      closeModal();
      if (typeof cb === 'function') cb();
    }

      const desktopMeta = {

    }

    function jumpToDay(dayNum) {
      selectedDay = dayNum;
      switchTab('itinerary');
    }

    // ------------------------------------------
    // 分頁 2：每日行程 (Itinerary Timeline - 手機單欄 / 電腦左側時間軸+右側統計面板)
    // ------------------------------------------
    function renderItineraryView(trip, theme) {
      // 橫向天數切換標籤 + 「+ 加一天」按鈕
      let dayTabsHtml = '';
      for (let d = 1; d <= trip.days; d++) {
        const isSelected = d === selectedDay;
        const info = getDayDateInfo(trip.startDate, d);
        dayTabsHtml += `
          <button type="button" onclick="selectDay(${d})" class="shrink-0 px-4 py-2 rounded-2xl border transition-all flex flex-col items-center min-w-[76px] md:min-w-[92px] ${
            isSelected
              ? `${theme.bg} text-white border-transparent shadow-sm scale-[1.02]`
              : 'bg-white text-ink-600 border-stone-200/80 hover:bg-stone-50'
          }">
            <span class="text-xs font-bold">Day ${d}</span>
            <span class="text-[11px] ${isSelected ? 'text-white/90' : 'text-ink-400'} mt-0.5">${info.dateText} ${info.weekday}</span>
          </button>
        `;
      }
      dayTabsHtml += `
        <button type="button" onclick="addExtraDay()" title="增加一天行程" class="shrink-0 px-3.5 py-2 rounded-2xl border border-dashed border-stone-300 bg-white/70 text-ink-600 hover:bg-white hover:border-sage-400 transition-all flex flex-col items-center justify-center min-w-[68px]">
          <i data-lucide="plus" class="w-4 h-4 text-sage-600"></i>
          <span class="text-[11px] font-semibold mt-0.5">加一天</span>
        </button>
      `;

      const dayActivities = trip.itinerary
        .filter(a => a.day === selectedDay)
        .sort((a, b) => a.time.localeCompare(b.time));

      const dayCost = dayActivities.reduce((sum, a) => sum + (Number(a.cost) || 0), 0);
      const dayMoney = formatMoneyWithTwd(dayCost, trip);
      const currentDayInfo = getDayDateInfo(trip.startDate, selectedDay);

      // 電腦版右側當日分類花費統計明細
      const catBreakdownHtml = Object.entries(ACTIVITY_CATEGORIES)
        .map(([k, cat]) => {
          const catSum = dayActivities
            .filter(a => a.category === k)
            .reduce((s, a) => s + (Number(a.cost) || 0), 0);
          if (catSum <= 0) return '';
          const m = formatMoneyWithTwd(catSum, trip);
          return `
            <div class="flex items-center justify-between text-xs py-1.5 border-b border-stone-100 last:border-none">
              <span class="inline-flex items-center gap-1.5 font-medium text-ink-700">
                <span class="w-5 h-5 rounded-md ${cat.bg} ${cat.text} flex items-center justify-center">
                  <i data-lucide="${cat.icon}" class="w-3 h-3"></i>
                </span>
                ${cat.label}
              </span>
              <div class="text-right">
                <span class="font-bold text-ink-900">${m.localText}</span>
                ${!m.isTWD ? `<span class="text-[10px] text-terracotta-600 ml-1">${m.twdText}</span>` : ''}
              </div>
            </div>
          `;
        })
        .join('');

      let timelineHtml = '';
      if (dayActivities.length === 0) {
        timelineHtml = `
          <div class="bg-white rounded-3xl p-8 text-center border border-dashed border-stone-300 my-2">
            <div class="w-12 h-12 rounded-2xl bg-sage-50 text-sage-500 flex items-center justify-center mx-auto mb-3">
              <i data-lucide="calendar-plus" class="w-6 h-6"></i>
            </div>
            <h4 class="font-bold text-ink-900 text-sm mb-1">Day ${selectedDay} 還是空的喔！</h4>
            <p class="text-xs text-ink-400 mb-4">點擊新增按鈕，開始規劃這天的景點或美食吧</p>
            <button type="button" onclick="openActivityModal()" class="px-4 py-2 rounded-xl ${theme.bg} text-white text-xs font-semibold shadow-sm active:scale-95 transition">
              + 新增第一個行程
            </button>
          </div>
        `;
      } else {
        timelineHtml = `<div class="relative pl-4 space-y-4 before:content-[''] before:absolute before:left-[23px] before:top-4 before:bottom-4 before:w-0.5 before:bg-stone-200">`;
        dayActivities.forEach(act => {
          const cat = ACTIVITY_CATEGORIES[act.category] || ACTIVITY_CATEGORIES.sightseeing;
          const actCostNum = Number(act.cost) || 0;
          const actMoney = formatMoneyWithTwd(actCostNum, trip);
          timelineHtml += `
            <div class="relative flex gap-3.5 group">
              <!-- 時間軸圓點 -->
              <div class="relative z-10 w-4 h-4 rounded-full bg-white border-4 border-sage-500 mt-4 shrink-0 shadow-xs"></div>

              <!-- 行程卡片 -->
              <div class="flex-1 bg-white rounded-2xl p-4 shadow-soft border border-stone-100 hover:border-sage-200 transition">
                <div class="flex items-start justify-between gap-2 mb-1.5">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs font-bold px-2 py-0.5 rounded-lg bg-stone-100 text-ink-900 font-mono">${escapeHtml(act.time)}</span>
                    <span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full ${cat.bg} ${cat.text}">
                      <i data-lucide="${cat.icon}" class="w-3 h-3"></i>
                      ${cat.label}
                    </span>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    <button type="button" onclick="openActivityModal('${act.id}')" class="p-1.5 text-ink-400 hover:text-sage-600 rounded-lg hover:bg-stone-100 transition" title="編輯">
                      <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                    </button>
                    <button type="button" onclick="confirmDeleteActivity('${act.id}')" class="p-1.5 text-ink-400 hover:text-rose-500 rounded-lg hover:bg-rose-50 transition" title="刪除">
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>

                <h4 class="font-bold text-base text-ink-900 leading-snug mb-1">${escapeHtml(act.title)}</h4>

                ${act.note ? `<p class="text-xs text-ink-600 leading-relaxed mb-3 bg-cream/80 p-2.5 rounded-xl border border-stone-100 whitespace-pre-line">${escapeHtml(act.note)}</p>` : ''}

                <!-- 底部資訊列：地點導航與預估花費（含台幣換算比對） -->
                <div class="flex items-center justify-between gap-2 pt-2 border-t border-stone-100 mt-2">
                  ${
                    act.location
                      ? `<button type="button" data-loc="${escapeHtml(act.location)}" onclick="openGoogleMaps(this.dataset.loc)" class="inline-flex items-center gap-1.5 text-xs font-semibold text-sky-600 bg-sky-50 hover:bg-sky-100 px-2.5 py-1.5 rounded-xl transition active:scale-95 min-w-0">
                          <i data-lucide="navigation" class="w-3.5 h-3.5 shrink-0"></i>
                          <span class="truncate">${escapeHtml(act.location)}</span>
                        </button>`
                      : `<span class="text-[11px] text-ink-400">未設定地圖位置</span>`
                  }

                  ${
                    actCostNum > 0
                      ? `<div class="text-right shrink-0 bg-stone-50 border border-stone-200/70 px-2.5 py-1 rounded-xl">
                          <div class="text-xs font-bold text-ink-900 leading-tight">${actMoney.localText}</div>
                          ${!actMoney.isTWD ? `<div class="text-[10px] font-semibold text-terracotta-600 leading-tight mt-0.5">${actMoney.twdText}</div>` : ''}
                        </div>`
                      : ''
                  }
                </div>
              </div>
            </div>
          `;
        });
        timelineHtml += `</div>`;
      }

      return `
        <div class="space-y-4 animate-view">
          <!-- 天數橫向滾動選擇器 -->
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 -mx-4 px-4 md:mx-0 md:px-0">
            ${dayTabsHtml}
          </div>

          <!-- 手機版當日小計標題列 (md:hidden) -->
          <div class="md:hidden flex items-center justify-between bg-white px-4 py-2.5 rounded-2xl border border-stone-100 shadow-xs gap-2">
            <div class="text-xs font-bold text-ink-900 shrink-0">
              Day ${selectedDay} · ${currentDayInfo.fullDate} (${currentDayInfo.weekday})
            </div>
            <div class="text-right">
              <div class="text-xs font-bold text-ink-900">
                <span class="text-[11px] font-normal text-ink-400">當日：</span>${dayMoney.localText}
              </div>
              ${!dayMoney.isTWD ? `<div class="text-[11px] font-semibold text-terracotta-600">${dayMoney.twdText}</div>` : ''}
            </div>
          </div>

          <!-- 主體版面：手機單欄；電腦雙欄（左側時間軸 + 右側當日摘要與快速新增面板） -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <div class="lg:col-span-8">
              ${timelineHtml}
            </div>

            <!-- 電腦版右側sticky當日統計與快捷面板 -->
            <div class="hidden lg:block lg:col-span-4 sticky top-24 space-y-4">
              <div class="bg-white rounded-3xl p-5 shadow-soft border border-stone-100 space-y-4">
                <div class="flex items-center justify-between border-b border-stone-100 pb-3">
                  <div>
                    <span class="text-[11px] font-bold uppercase tracking-wider ${theme.text}">Day ${selectedDay} 行程摘要</span>
                    <h4 class="font-bold text-base text-ink-900 mt-0.5">${currentDayInfo.fullDate} (${currentDayInfo.weekday})</h4>
                  </div>
                  <span class="text-xs font-bold px-2.5 py-1 rounded-full ${theme.light} ${theme.text}">${dayActivities.length} 個地點</span>
                </div>

                <div class="bg-cream rounded-2xl p-3.5 border border-stone-200/70">
                  <span class="text-[11px] font-medium text-ink-600 block mb-1">當日預估總花費</span>
                  <div class="text-xl font-bold text-ink-900">${dayMoney.localText}</div>
                  ${!dayMoney.isTWD ? `<div class="text-xs font-bold text-terracotta-600 mt-0.5">${dayMoney.twdText}</div>` : ''}
                </div>

                ${
                  catBreakdownHtml
                    ? `<div class="space-y-1">
                        <p class="text-[11px] font-bold text-ink-400 uppercase tracking-wider mb-1">分類花費明細</p>
                        ${catBreakdownHtml}
                      </div>`
                    : ''
                }

                <button type="button" onclick="openActivityModal()" class="w-full py-3 rounded-2xl ${theme.bg} text-white font-bold text-xs shadow-sm hover:opacity-95 flex items-center justify-center gap-1.5 transition">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  新增 Day ${selectedDay} 行程
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function selectDay(dayNum) {
      selectedDay = dayNum;
      renderApp();
    }

    function addExtraDay() {
      const trip = getCurrentTrip();
      if (trip.days >= 60) {
        showToast('最多支援 60 天行程');
        return;
      }
      trip.days += 1;
      selectedDay = trip.days;
      saveState();
      renderApp();
      showToast(`已新增 Day ${trip.days}`);
    }

    // ------------------------------------------
    // 分頁 3：隨手筆記 (Travel Notes - 手機單欄 / 電腦 2~3 欄卡片網格)
    // ------------------------------------------
    function renderNotesView(trip, theme) {
      const filters = [
        { key: 'all', label: '全部筆記' },
        { key: 'food', label: '美食清單' },
        { key: 'shopping', label: '必買購物' },
        { key: 'booking', label: '住宿/票券' },
        { key: 'diary', label: '旅遊日記' }
      ];

      const filterChipsHtml = filters.map(f => {
        const active = noteFilter === f.key;
        return `
          <button type="button" onclick="setNoteFilter('${f.key}')" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold transition ${
            active
              ? `${theme.bg} text-white shadow-xs`
              : 'bg-white text-ink-600 border border-stone-200/80 hover:bg-stone-50'
          }">
            ${f.label}
          </button>
        `;
      }).join('');

      const q = noteSearchQuery.trim().toLowerCase();
      const filteredNotes = trip.notes.filter(n => {
        const matchCat = noteFilter === 'all' || n.category === noteFilter;
        const matchQuery = !q || n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q);
        return matchCat && matchQuery;
      });

      let notesListHtml = '';
      if (filteredNotes.length === 0) {
        notesListHtml = `
          <div class="bg-white rounded-3xl p-8 text-center border border-dashed border-stone-300 my-4">
            <div class="w-12 h-12 rounded-2xl bg-terracotta-50 text-terracotta-500 flex items-center justify-center mx-auto mb-3">
              <i data-lucide="notebook-pen" class="w-6 h-6"></i>
            </div>
            <h4 class="font-bold text-ink-900 text-sm mb-1">找不到相關筆記</h4>
            <p class="text-xs text-ink-400">試試切換其他分類，或點擊新增按鈕寫下新的旅遊靈感！</p>
          </div>
        `;
      } else {
        notesListHtml = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5 md:gap-4">`;
        filteredNotes.forEach(note => {
          const cat = NOTE_CATEGORIES[note.category] || NOTE_CATEGORIES.diary;
          notesListHtml += `
            <div class="bg-white rounded-2xl p-4 shadow-soft border border-stone-100 hover:border-sage-200 transition journal-dots flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2.5 py-0.5 rounded-full ${cat.badge}">
                    <i data-lucide="${cat.icon}" class="w-3 h-3"></i>
                    ${cat.label}
                  </span>
                  <div class="flex items-center gap-0.5">
                    <span class="text-[11px] text-ink-400 mr-1">${escapeHtml(note.updatedAt || '')}</span>
                    <button type="button" onclick="copyNoteContent('${note.id}')" class="p-1.5 text-ink-400 hover:text-sky-600 rounded-lg hover:bg-sky-50 transition" title="複製內容">
                      <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                    </button>
                    <button type="button" onclick="openNoteModal('${note.id}')" class="p-1.5 text-ink-400 hover:text-sage-600 rounded-lg hover:bg-stone-100 transition" title="編輯">
                      <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                    </button>
                    <button type="button" onclick="confirmDeleteNote('${note.id}')" class="p-1.5 text-ink-400 hover:text-rose-500 rounded-lg hover:bg-rose-50 transition" title="刪除">
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>
                <h4 class="font-bold text-base text-ink-900 mb-1.5">${escapeHtml(note.title)}</h4>
              </div>
              <p class="text-xs text-ink-600 whitespace-pre-line leading-relaxed bg-white/85 p-2.5 rounded-xl border border-stone-100/80">${escapeHtml(note.content)}</p>
            </div>
          `;
        });
        notesListHtml += `</div>`;
      }

      return `
        <div class="space-y-4 animate-view">
          <!-- 搜尋框與分類篩選標籤（電腦版並排顯示，手機版上下排列） -->
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="relative md:w-80 shrink-0">
              <i data-lucide="search" class="w-4 h-4 text-ink-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input
                id="note-search-input"
                type="text"
                value="${escapeHtml(noteSearchQuery)}"
                oninput="handleNoteSearch(this.value)"
                placeholder="搜尋美食名單、訂房代號或伴手禮..."
                class="w-full bg-white border border-stone-200/90 rounded-2xl pl-10 pr-9 py-2.5 text-sm text-ink-900 placeholder:text-ink-400 focus:outline-none focus:border-sage-500 shadow-xs"
              />
              ${
                noteSearchQuery
                  ? `<button type="button" onclick="handleNoteSearch('')" class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-400 hover:text-ink-600">
                      <i data-lucide="x-circle" class="w-4 h-4"></i>
                    </button>`
                  : ''
              }
            </div>

            <!-- 分類篩選標籤 -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 -mx-4 px-4 md:mx-0 md:px-0 md:pb-0">
              ${filterChipsHtml}
            </div>
          </div>

          <!-- 筆記卡片列表 -->
          ${notesListHtml}
        </div>
      `;
    }

    function setNoteFilter(key) {
      noteFilter = key;
      renderApp();
    }

    function handleNoteSearch(val) {
      noteSearchQuery = val;
      renderApp();
      const input = document.getElementById('note-search-input');
      if (input) {
        input.focus();
        input.setSelectionRange(val.length, val.length);
      }
    }

    function copyNoteContent(noteId) {
      const trip = getCurrentTrip();
      const note = trip.notes.find(n => n.id === noteId);
      if (!note) return;
      copyTextToClipboard(`${note.title}\n${note.content}`, '已複製筆記內容');
    }

    // ------------------------------------------
    // 分頁 4：行李與行前清單 (Checklist)
    // ------------------------------------------
    function renderChecklistView(trip, theme) {
      const total = trip.checklist.length;
      const checked = trip.checklist.filter(c => c.checked).length;
      const percent = total > 0 ? Math.round((checked / total) * 100) : 0;

      let categoriesHtml = '';
      Object.entries(CHECKLIST_CATEGORIES).forEach(([catKey, catInfo]) => {
        const items = trip.checklist.filter(c => c.category === catKey);
        const isCollapsed = Boolean(collapsedChecklistCats[catKey]);
        categoriesHtml += `
          <div class="bg-white rounded-2xl p-4 shadow-soft border border-stone-100">
            <button type="button" onclick="toggleChecklistCategory('${catKey}')" class="w-full flex items-center justify-between text-left">
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg ${theme.light} ${theme.text} flex items-center justify-center">
                  <i data-lucide="${catInfo.icon}" class="w-4 h-4"></i>
                </div>
                <h4 class="font-bold text-sm text-ink-900">${catInfo.label}</h4>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-medium text-ink-400">${items.filter(i => i.checked).length}/${items.length}</span>
                <i data-lucide="${isCollapsed ? 'chevron-down' : 'chevron-up'}" class="w-4 h-4 text-ink-400"></i>
              </div>
            </button>

            ${
              isCollapsed
                ? ''
                : `<div class="mt-3 pt-2 border-t border-stone-100/80">
                    ${
                      items.length === 0
                        ? `<p class="text-xs text-ink-400 py-2 text-center">此分類尚無項目</p>`
                        : `<div class="space-y-1.5">
                            ${items
                              .map(
                                item => `
                              <div class="flex items-center justify-between gap-2 p-2 rounded-xl hover:bg-stone-50 transition group">
                                <label class="flex items-center gap-3 flex-1 cursor-pointer select-none min-w-0">
                                  <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleChecklistItem('${item.id}')" class="w-5 h-5 rounded-md accent-sage-600 cursor-pointer shrink-0" />
                                  <span class="text-sm leading-snug break-words ${item.checked ? 'line-through text-ink-400' : 'text-ink-900 font-medium'}">${escapeHtml(item.text)}</span>
                                </label>
                                <button type="button" onclick="deleteChecklistItem('${item.id}')" class="p-1.5 text-ink-400 hover:text-rose-500 rounded-lg opacity-70 hover:opacity-100 transition shrink-0" title="刪除">
                                  <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                              </div>
                            `
                              )
                              .join('')}
                          </div>`
                    }
                  </div>`
            }
          </div>
        `;
      });

      return `
        <div class="space-y-4 animate-view">
          <!-- 總進度條卡片 + 重置按鈕 -->
          <div class="bg-white rounded-2xl p-4 md:p-5 shadow-soft border border-stone-100">
            <div class="flex items-center justify-between mb-2">
              <div>
                <h3 class="font-bold text-sm md:text-base text-ink-900">行前準備進度</h3>
                <p class="text-xs text-ink-400 mt-0.5">已完成 ${checked} 項，還差 ${total - checked} 項</p>
              </div>
              <div class="flex items-center gap-2.5">
                ${
                  checked > 0
                    ? `<button type="button" onclick="resetAllChecklist()" class="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-stone-100 text-ink-600 hover:bg-stone-200 transition">重置勾選</button>`
                    : ''
                }
                <span class="text-2xl font-bold ${theme.text}">${percent}%</span>
              </div>
            </div>
            <div class="w-full h-2.5 bg-stone-100 rounded-full overflow-hidden">
              <div class="h-full ${theme.bg} rounded-full transition-all duration-300" style="width: ${percent}%"></div>
            </div>
          </div>

          <!-- 分類清單（手機單欄 / 電腦雙欄並排） -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 md:gap-4 items-start">
            ${categoriesHtml}
          </div>
        </div>
      `;
    }

    function toggleChecklistCategory(catKey) {
      collapsedChecklistCats[catKey] = !collapsedChecklistCats[catKey];
      renderApp();
    }

    function toggleChecklistItem(itemId) {
      const trip = getCurrentTrip();
      const item = trip.checklist.find(c => c.id === itemId);
      if (item) {
        item.checked = !item.checked;
        saveState();
        renderApp();
      }
    }

    function resetAllChecklist() {
      const trip = getCurrentTrip();
      trip.checklist.forEach(c => { c.checked = false; });
      saveState();
      renderApp();
      showToast('已重置全部勾選狀態');
    }

    function deleteChecklistItem(itemId) {
      const trip = getCurrentTrip();
      trip.checklist = trip.checklist.filter(c => c.id !== itemId);
      saveState();
      renderApp();
      showToast('已刪除清單項目');
    }

    // ==========================================
    // 7. 彈窗表單與互動操作 (Modals)
    // ==========================================
    function openModal(htmlContent) {
      const container = document.getElementById('modal-container');
      const body = document.getElementById('modal-body');
      body.innerHTML = htmlContent;
      container.classList.remove('hidden');
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function closeModal() {
      const container = document.getElementById('modal-container');
      container.classList.add('hidden');
    }

    // ------------------------------------------
    // 彈窗 A：新增 / 編輯 每日行程項目
    // ------------------------------------------
    function openActivityModal(activityId = null) {

      const isEdit = Boolean(act);
      const currInfo = getTripCurrencyInfo(trip);
      const initialCost = act?.cost || 0;
      const initialTwd = Math.round(initialCost * currInfo.rate);

      const catOptions = Object.entries(ACTIVITY_CATEGORIES)
        .map(([k, v]) => `<option value="${k}" ${(act?.category || 'sightseeing') === k ? 'selected' : ''}>${v.label}</option>`)
        .join('');

      let dayOptions = '';
      for (let d = 1; d <= trip.days; d++) {
        dayOptions += `<option value="${d}" ${(act?.day || selectedDay) === d ? 'selected' : ''}>Day ${d}</option>`;
      }

      openModal(`
        <div class="p-5 overflow-y-auto space-y-4">
          <div class="flex items-center justify-between border-b border-stone-100 pb-3">
            <h3 class="font-bold text-base text-ink-900">${isEdit ? '編輯行程項目' : '新增行程項目'}</h3>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-ink-600"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <form onsubmit="saveActivityForm(event, '${activityId || ''}')" class="space-y-3.5">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-ink-600 mb-1">天數</label>
                <select name="day" class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500">
                  ${dayOptions}
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-ink-600 mb-1">時間</label>
                <input type="time" name="time" required value="${act?.time || '10:00'}" class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500" />
              </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
              <div class="col-span-1">
                <label class="block text-xs font-semibold text-ink-600 mb-1">分類</label>
                <select name="category" class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500">
                  ${catOptions}
                </select>
              </div>
              <div class="col-span-2">
                <label class="block text-xs font-semibold text-ink-600 mb-1">行程名稱 *</label>
                <input type="text" name="title" required placeholder="例如：淺草寺雷門" value="${escapeHtml(act?.title || '')}" class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-ink-600 mb-1">Google Maps 搜尋地點</label>
              <input type="text" name="location" placeholder="輸入店名或地址（可一鍵開啟地圖）" value="${escapeHtml(act?.location || '')}" class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500" />
            </div>

            <div>
              <div class="flex items-center justify-between mb-1">
                <label class="text-xs font-semibold text-ink-600">預估花費 (${escapeHtml(currInfo.code)} ${escapeHtml(currInfo.symbol)})</label>
                ${
                  !currInfo.isTWD
                    ? `<span id="activity-twd-preview" class="text-xs font-bold text-terracotta-600 bg-terracotta-50 px-2 py-0.5 rounded-md">
                        ≈ NT$ ${initialTwd.toLocaleString()}
                      </span>`
                    : ''
                }
              </div>
              <input
                type="number"
                name="cost"
                min="0"
                step="any"
                placeholder="0"
                value="${act?.cost || ''}"
                oninput="updateActivityTwdPreview(this.value, ${currInfo.rate}, ${currInfo.isTWD})"
                class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500"
              />
              ${
                !currInfo.isTWD
                  ? `<p class="text-[11px] text-ink-400 mt-1">目前匯率：1 ${escapeHtml(currInfo.code)} = ${currInfo.rate} TWD</p>`
                  : ''
              }
            </div>

            <div>
              <label class="block text-xs font-semibold text-ink-600 mb-1">備註 / 必點推薦 / 交通方式</label>
              <textarea name="note" rows="3" placeholder="記錄預約代號、必吃菜單或注意事項..." class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500">${escapeHtml(act?.note || '')}</textarea>
            </div>

            <button type="submit" class="w-full py-3 rounded-2xl bg-sage-500 text-white font-bold text-sm shadow-md hover:bg-sage-600 active:scale-[0.99] transition">
              ${isEdit ? '儲存變更' : '加入行程'}
            </button>
          </form>
        </div>
      `);
    }

    function updateActivityTwdPreview(val, rate, isTWD) {
      if (isTWD) return;
      const previewEl = document.getElementById('activity-twd-preview');
      if (!previewEl) return;
      const num = Number(val) || 0;
      const twd = Math.round(num * rate);
      previewEl.textContent = `≈ NT$ ${twd.toLocaleString()}`;
    }

    function saveActivityForm(e, activityId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const trip = getCurrentTrip();
      const dayNum = Number(fd.get('day'));

      const payload = {
        id: activityId || generateId('act'),
        day: dayNum,
        time: fd.get('time'),
        category: fd.get('category'),
        title: fd.get('title').trim(),
        location: fd.get('location').trim(),
        cost: Number(fd.get('cost')) || 0,
        note: fd.get('note').trim()
      };

      if (activityId) {
        const idx = trip.itinerary.findIndex(a => a.id === activityId);
        if (idx !== -1) trip.itinerary[idx] = payload;
      } else {
        trip.itinerary.push(payload);
      }

      selectedDay = dayNum;
      saveState();
      closeModal();
      renderApp();
      showToast(activityId ? '行程已更新' : '已新增行程項目');
    }

    function confirmDeleteActivity(activityId) {
      openConfirmModal('刪除行程項目', '確定要刪除這筆行程紀錄嗎？刪除後無法復原。', '確認刪除', () => {
        const trip = getCurrentTrip();
        trip.itinerary = trip.itinerary.filter(a => a.id !== activityId);
        saveState();
        renderApp();
        showToast('已刪除該行程');
      });
    }

      openModal(`

            <button type="button" onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-ink-600"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <form onsubmit="saveNoteForm(event, '${noteId || ''}')" class="space-y-3.5">
            <div>
              <label class="block text-xs font-semibold text-ink-600 mb-1">筆記分類</label>
              <select name="category" class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500">

            <div>
              <label class="block text-xs font-semibold text-ink-600 mb-1">標題 *</label>
              <input type="text" name="title" required placeholder="例如：必買伴手禮清單 / 飯店訂房代號" value="${escapeHtml(note?.title || '')}" class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500" />
            </div>

            <div>
              <label class="block text-xs font-semibold text-ink-600 mb-1">筆記內容 *</label>
              <textarea name="content" rows="6" required placeholder="寫下任何你想記住的資訊..." class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm leading-relaxed focus:outline-none focus:border-sage-500">${escapeHtml(note?.content || '')}</textarea>
            </div>

            <button type="submit" class="w-full py-3 rounded-2xl bg-sage-500 text-white font-bold text-sm shadow-md hover:bg-sage-600 active:scale-[0.99] transition">
              ${isEdit ? '更新筆記' : '儲存筆記'}
            </button>
          </form>
        </div>
      `);
    }

    function saveNoteForm(e, noteId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const trip = getCurrentTrip();
      const todayStr = formatDateISO(new Date());

      const payload = {
        id: noteId || generateId('note'),
        category: fd.get('category'),
        title: fd.get('title').trim(),
        content: fd.get('content').trim(),
        updatedAt: todayStr
      };

      if (noteId) {
        const idx = trip.notes.findIndex(n => n.id === noteId);
        if (idx !== -1) trip.notes[idx] = payload;
      } else {
        trip.notes.unshift(payload);
      }

      saveState();
      closeModal();
      renderApp();
      showToast(noteId ? '筆記已更新' : '已儲存新筆記');
    }

    function confirmDeleteNote(noteId) {
      openConfirmModal('刪除筆記', '確定要刪除這則隨手筆記嗎？', '確認刪除', () => {
        const trip = getCurrentTrip();
        trip.notes = trip.notes.filter(n => n.id !== noteId);
        saveState();
        renderApp();
        showToast('已刪除筆記');
      });
    }

    // ------------------------------------------
    // 彈窗 C：新增行李清單項目
    // ------------------------------------------

        .map(([k, v]) => `<option value="${k}">${v.label}</option>`)
        .join('');

      openModal(`
        <div class="p-5 overflow-y-auto space-y-4">
          <div class="flex items-center justify-between border-b border-stone-100 pb-3">
            <h3 class="font-bold text-base text-ink-900">新增行李 / 待辦項目</h3>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-ink-600"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <form onsubmit="saveChecklistForm(event)" class="space-y-3.5">

              <label class="block text-xs font-semibold text-ink-600 mb-1">分類</label>

              </select>
            </div>

            <div>

              <input type="text" name="text" required placeholder="例如：萬國轉接頭、太陽眼鏡" class="w-full bg-cream border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500" />
            </div>

            <button type="submit" class="w-full py-3 rounded-2xl bg-sage-500 text-white font-bold text-sm shadow-md hover:bg-sage-600 active:scale-[0.99] transition">
              加入清單
            </button>
          </form>

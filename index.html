    async function handleGenerateAndCopyTextSyncCode() {
      try {
        const codeStr = await encodeStateToTextSyncCode(appState);
        const charLen = codeStr.length;
        const box = document.getElementById('text-sync-generated-box');
        const outEl = document.getElementById('text-sync-output');
        const metaEl = document.getElementById('text-sync-meta');

        if (box && outEl && metaEl) {
          box.classList.remove('hidden');
          outEl.value = codeStr;
          const isLineFriendly = charLen <= 9500;
          metaEl.innerHTML = isLineFriendly
            ? `<span class="text-sage-700 font-bold flex items-center gap-1"><i data-lucide="check-circle-2" class="w-3.5 h-3.5 shrink-0"></i> 已複製！共 ${charLen.toLocaleString()} 字元（適合直接貼入 LINE / Telegram 傳送）</span>`
            : `<span class="text-amber-700 font-bold flex items-center gap-1"><i data-lucide="alert-triangle" class="w-3.5 h-3.5 shrink-0"></i> 已複製！共 ${charLen.toLocaleString()} 字元（因內含照片較長，若通訊軟體截斷請改用下方「匯出 JSON 備份檔」）</span>`;
          if (window.lucide) lucide.createIcons();
        }

        copyTextToClipboard(codeStr, `已產生並複製同步文字碼（${charLen.toLocaleString()} 字元）`);
      } catch (err) {
        console.error('產生文字同步碼失敗:', err);
        showToast('產生同步碼失敗，請改用 JSON 備份檔');
      }
    }

    async function handleImportTextSyncCode() {
      const inputEl = document.getElementById('text-sync-input');
      const rawText = inputEl ? inputEl.value : '';
      if (!rawText.trim()) {
        showToast('請先貼上 TABINOTE: 開頭的同步文字碼');
        if (inputEl) inputEl.focus();
        return;
      }

      try {
        const decodedState = await decodeTextSyncCodeToState(rawText);
        applyIncomingSyncState(decodedState, syncMergeMode);
        closeModal();
        renderApp();
        showToast(syncMergeMode === 'merge' ? '已智慧合併文字同步碼資料！' : '已完整覆蓋並匯入同步碼資料！');
      } catch (err) {
        console.error('解析文字同步碼失敗:', err);
        showToast(err.message || '同步碼格式錯誤或內容不完整，請確認已完整複製');
      }
    }

    function startPeerSender(code) {
      const qrBox = document.getElementById('sync-qrcode-box');
      if (qrBox && window.QRCode) {
        qrBox.innerHTML = '';
        try {
          const baseUrl = window.location.href.split('?')[0].split('#')[0];
          const syncUrl = `${baseUrl}?sync=${code}`;
          new QRCode(qrBox, {
            text: syncUrl,
            width: 124,
            height: 124,
            colorDark: '#2B2927',
            colorLight: '#FFFFFF',
            correctLevel: QRCode.CorrectLevel.M
          });
        } catch (err) {
          qrBox.innerHTML = `<span class="text-[11px] text-charcoal-400">請輸入 6 位數連線碼</span>`;
        }
      }

      const statusEl = document.getElementById('sync-sender-status');
      if (!window.Peer) {
        if (statusEl) statusEl.innerHTML = `<span class="text-rose-600">無法載入 PeerJS 連線模組，請改用「文字同步碼」分頁。</span>`;
        return;
      }

      const peerId = `tabinote-sync-${code}`;
      const peer = new Peer(peerId, { debug: 0 });
      activePeer = peer;

      peer.on('open', () => {
        if (statusEl) {
          statusEl.innerHTML = `
            <span class="w-2 h-2 rounded-full bg-sage-500 animate-pulse"></span>
            <span class="text-sage-700">等待另一台裝置連線中（若跨網路逾時請用「文字同步碼」）</span>
          `;
        }
      });

      peer.on('connection', (conn) => {
        if (statusEl) {
          statusEl.innerHTML = `
            <span class="w-2 h-2 rounded-full bg-terra-500 animate-ping"></span>
            <span class="text-terra-600">裝置已連上！正在傳送最新行程與筆記...</span>
          `;
        }

        conn.on('open', () => {
          conn.send({
            type: 'TABINOTE_SYNC_PAYLOAD',
            sentAt: Date.now(),
            state: appState
          });
        });

        conn.on('data', (ack) => {
          if (ack && ack.type === 'TABINOTE_SYNC_ACK') {
            if (statusEl) {
              statusEl.innerHTML = `
                <i data-lucide="check-circle-2" class="w-4 h-4 text-sage-600"></i>
                <span class="text-sage-700 font-bold">同步完成！共傳送 ${appState.trips.length} 趟旅程資料</span>
              `;
              if (window.lucide) lucide.createIcons();
            }
            showToast('已成功將資料同步至另一台裝置！');
          }
        });
      });

      peer.on('error', (err) => {
        console.warn('PeerJS Sender Error:', err);
        if (statusEl) {
          statusEl.innerHTML = `<span class="text-rose-600">連線服務受限 (${err.type || '網路阻擋'})，建議改用「文字同步碼」傳送。</span>`;
        }
      });
    }

    function startPeerReceiver() {
      const codeInput = document.getElementById('sync-receive-code-input');
      const statusEl = document.getElementById('sync-receiver-status');
      const btn = document.getElementById('sync-connect-btn');
      const code = (codeInput?.value || '').trim().replace(/\D/g, '');

      if (code.length !== 6) {
        showToast('請輸入完整的 6 位數連線碼');
        if (codeInput) codeInput.focus();
        return;
      }

      if (!window.Peer) {
        showToast('無法載入 PeerJS 連線模組，請改用文字同步碼');
        return;
      }

      destroyActivePeer();
      if (btn) {
        btn.disabled = true;
        btn.classList.add('opacity-70');
      }
      if (statusEl) {
        statusEl.className = 'text-[11px] font-semibold px-3 py-2 rounded-xl border border-sand bg-paper text-charcoal-700 flex items-center justify-center gap-2';
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-terra-500 animate-ping"></span><span>正在搜尋發送端 (${code})...</span>`;
      }

      const peer = new Peer({ debug: 0 });
      activePeer = peer;

      const timeoutTimer = setTimeout(() => {
        if (statusEl) {
          statusEl.className = 'text-[11px] font-semibold px-3 py-2 rounded-xl border border-rose-200 bg-rose-50 text-rose-600 text-center';
          statusEl.textContent = '連線逾時：跨網路可能遭防火牆阻擋，建議切換至「文字同步碼 (推薦)」直接貼上匯入。';
        }
        if (btn) {
          btn.disabled = false;
          btn.classList.remove('opacity-70');
        }
        destroyActivePeer();
      }, 15000);

      peer.on('open', () => {
        const targetId = `tabinote-sync-${code}`;
        const conn = peer.connect(targetId, { reliable: true });

        conn.on('open', () => {
          if (statusEl) {
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-sage-500 animate-pulse"></span><span>已連上發送端，正在接收資料...</span>`;
          }
        });

        conn.on('data', (payload) => {
          clearTimeout(timeoutTimer);
          if (payload && payload.type === 'TABINOTE_SYNC_PAYLOAD' && payload.state && Array.isArray(payload.state.trips)) {
            applyIncomingSyncState(payload.state, syncMergeMode);
            conn.send({ type: 'TABINOTE_SYNC_ACK' });

            if (window.history && window.location.search.includes('sync=')) {
              const cleanUrl = window.location.href.split('?')[0];
              window.history.replaceState({}, document.title, cleanUrl);
            }

            setTimeout(() => {
              closeModal();
              renderApp();
              showToast(syncMergeMode === 'merge' ? '智慧合併同步成功！' : '已完整同步發送端資料！');
            }, 350);
          }
        });

        conn.on('error', () => {
          clearTimeout(timeoutTimer);
          if (statusEl) {
            statusEl.className = 'text-[11px] font-semibold px-3 py-2 rounded-xl border border-rose-200 bg-rose-50 text-rose-600 text-center';
            statusEl.textContent = '無法連線至發送端，請確認連線碼或改用「文字同步碼」。';
          }
          if (btn) {
            btn.disabled = false;
            btn.classList.remove('opacity-70');
          }
        });
      });

      peer.on('error', (err) => {
        clearTimeout(timeoutTimer);
        if (statusEl) {
          statusEl.className = 'text-[11px] font-semibold px-3 py-2 rounded-xl border border-rose-200 bg-rose-50 text-rose-600 text-center';
          statusEl.textContent = err.type === 'peer-unavailable'
            ? '找不到此連線碼，請確認發送端正停留在連線畫面，或改用「文字同步碼」。'
            : `連線發生錯誤 (${err.type || '請重試'})`;
        }
        if (btn) {
          btn.disabled = false;
          btn.classList.remove('opacity-70');
        }
      });
    }

    function applyIncomingSyncState(incomingState, mode = 'merge') {
      const incomingTrips = (incomingState.trips || []).map(normalizeTripData);
      if (incomingTrips.length === 0) return;

      if (mode === 'overwrite') {
        appState = {
          currentTripId: incomingState.currentTripId || incomingTrips[0].id,
          trips: incomingTrips
        };
      } else {
        const tripMap = new Map();
        appState.trips.forEach(t => {
          tripMap.set(t.id, normalizeTripData(t));
        });
        incomingTrips.forEach(inc => {
          const existing = tripMap.get(inc.id);
          if (!existing || (inc.updatedAt || 0) >= (existing.updatedAt || 0)) {
            tripMap.set(inc.id, inc);
          }
        });
        appState.trips = Array.from(tripMap.values());
        if (incomingState.currentTripId && tripMap.has(incomingState.currentTripId)) {
          appState.currentTripId = incomingState.currentTripId;
        }
      }
      selectedDay = 1;
      saveState(appState, false);
    }

    function downloadBackupFile() {
      const dataStr = JSON.stringify(appState, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateTag = formatDateISO(new Date());
      a.href = url;
      a.download = `旅途手帳備份_${dateTag}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('已開始下載 JSON 備份檔');
    }

    function handleImportFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (!parsed || !Array.isArray(parsed.trips) || parsed.trips.length === 0) {
            throw new Error('格式不符');
          }
          parsed.trips = parsed.trips.map(normalizeTripData);
          appState = parsed;
          selectedDay = 1;
          saveState(appState, false);
          closeModal();
          renderApp();
          showToast('JSON 備份已成功還原！');
        } catch (err) {
          showToast('JSON 檔案格式錯誤，無法匯入');
        }
      };
      reader.readAsText(file);
    }

    function confirmResetDemoData() {
      openConfirmModal('還原預設範例資料', '這將會清除目前所有自訂旅程並恢復預設的「東京賞楓與咖啡巡禮 4 日遊」範例資料，確定要繼續嗎？', '確認還原', () => {
        appState = getDefaultData();
        selectedDay = 1;
        noteFilter = 'all';
        noteSearchQuery = '';
        saveState(appState, false);
        renderApp();
        showToast('已還原預設範例資料');
      });
    }

    // ------------------------------------------
    // 彈窗 H：安裝到手機主畫面 (PWA 教學)
    // ------------------------------------------
    function openInstallModal() {
      const promptBanner = deferredInstallPrompt
        ? `<button type="button" onclick="triggerNativePwaInstall()" class="w-full py-3 rounded-2xl bg-terra-500 text-white font-bold text-sm shadow-sm hover:bg-terra-600 flex items-center justify-center gap-2 active:scale-[0.99] transition">
            <i data-lucide="download" class="w-4 h-4"></i>
            立即安裝到手機主畫面
          </button>`
        : '';

      openModal(`
        <div class="p-5 overflow-y-auto space-y-4">
          <div class="flex items-center justify-between border-b border-sand pb-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-xl bg-terra-50 text-terra-600 flex items-center justify-center">
                <i data-lucide="smartphone" class="w-4 h-4"></i>
              </div>
              <h3 class="font-bold text-base text-charcoal-900">把「旅途手帳」放到手機主畫面</h3>
            </div>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-full bg-cream text-charcoal-700"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <p class="text-xs text-charcoal-600 leading-relaxed">
            本網頁支援 PWA 獨立應用程式模式！加入主畫面後，就能像原生 App 一樣全螢幕開啟，所有行程與筆記都會自動保存在手機中。
          </p>

          ${promptBanner}

          <div class="bg-cream rounded-2xl p-4 border border-sand space-y-2">
            <h4 class="font-bold text-sm text-charcoal-900 flex items-center gap-1.5">
              <span class="px-2 py-0.5 rounded bg-charcoal-900 text-white text-[10px]">iPhone / iPad</span>
              使用 Safari 瀏覽器
            </h4>
            <ol class="text-xs text-charcoal-700 space-y-1.5 list-decimal list-inside leading-relaxed">
              <li>點擊畫面底部工具列的 <strong class="text-charcoal-900">「分享」圖示</strong>（方框向上箭頭 <i data-lucide="share" class="w-3.5 h-3.5 inline text-sky-600"></i>）。</li>
              <li>往下滑動選單，找到並點擊 <strong class="text-charcoal-900">「加入主畫面」</strong>。</li>
              <li>點擊右上角 <strong class="text-charcoal-900">「新增」</strong>，桌面就會出現專屬手帳圖示！</li>
            </ol>
          </div>

          <div class="bg-cream rounded-2xl p-4 border border-sand space-y-2">
            <h4 class="font-bold text-sm text-charcoal-900 flex items-center gap-1.5">
              <span class="px-2 py-0.5 rounded bg-sage-600 text-white text-[10px]">Android</span>
              使用 Chrome 瀏覽器
            </h4>
            <ol class="text-xs text-charcoal-700 space-y-1.5 list-decimal list-inside leading-relaxed">
              <li>點擊瀏覽器右上角的 <strong class="text-charcoal-900">「⋮」更多選單</strong>。</li>
              <li>選擇 <strong class="text-charcoal-900">「加到主畫面」</strong> 或 <strong class="text-charcoal-900">「安裝應用程式」</strong>。</li>
              <li>確認名稱後點擊新增即可完成。</li>
            </ol>
          </div>

          <button type="button" onclick="closeModal()" class="w-full py-3 rounded-2xl bg-terra-500 text-white font-bold text-sm shadow-sm active:scale-[0.99] transition">
            我知道了！
          </button>
        </div>
      `);
    }

    async function triggerNativePwaInstall() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      closeModal();
      if (outcome === 'accepted') {
        showToast('已開始安裝「旅途手帳」App！');
      }
    }

    // ==========================================
    // 8. 啟動應用程式與 URL 掃碼同步偵測
    // ==========================================
    window.addEventListener('DOMContentLoaded', async () => {
      await initStorageAndLoadState();
      renderApp();

      try {
        const params = new URLSearchParams(window.location.search);
        const syncParam = (params.get('sync') || '').replace(/\D/g, '');
        if (syncParam.length === 6) {
          setTimeout(() => {
            openSyncModal('peer', syncParam);
          }, 250);
        }
      } catch (e) {}
    });
  </script>
